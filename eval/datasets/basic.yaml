# CoMem 检索质量基线数据集。
#
# 语料全部取自这个项目的真实文档与真实使用场景（架构文档、运维手册、决策记录里
# 讨论过的问题），不是 foo / bar / lorem。每篇文档只描述一个主题，正文可独立阅读。
#
# ## 标注约定
#
# - `relevant`：二值相关性，用于 recall 与 MRR。
# - `graded`：0–3 的分级相关度，用于 nDCG。0 表示「字面相似但语义无关」的难负例，
#   它不进入 `relevant`，但会进入 nDCG 的理想排序候选（增益为 0，所以只惩罚
#   「把它排在相关文档前面」）。
# - 每条查询上面的注释写清「为什么这几条相关、为什么相关程度不同」。没有注释的
#   标注无法复核，等于没有标注。
#
# ## 查询分布（105 条）
#
# 1. 中文双字词（28）：记忆 / 偏好 / 严格 / 物化 / 降级 / 缓存 / 提交 / 部署 / 权限 /
#    摘要 / 索引 / 向量 / 会话 / 归档 / 补丁 / 租约 / 游标 / 备份 / 监控 / 提示词 /
#    重试 / 排序 / 并发 / 授权 / 加权 / 校验 / 过期 / 过滤。`unicode61` 的分词盲区，
#    CoMem 用 CJK 单字切分 + 短语匹配覆盖。
# 2. 同义改写（56）：query 用 A 说法，语料用 B 说法，只有语义检索能命中。
# 3. 专有名词 / 标识符（15）：sqlite-vec / pnpm verify / URI_CHUNK_SIZE /
#    node_permission / bge-m3 / COMEM_BYPASS_SESSION / keepRecentCount / dedup_turns /
#    .abstract.md / rule_search / expires_at / GLOB / pnpm check:config /
#    memory_diff.json / bge-reranker-v2-m3。只有关键词检索能精确命中。
# 4. 分级相关性（3）：一条查询对应多篇文档，相关程度不同。
# 5. 难负例（3）：`记忆化缓存` 与 `记忆` / `缓存`、`摘要模型` 与 `bge-m3` /
#    `rerank-model`、`许可证过期` 与 `ttl-sweep` 字面重叠但语义不同。
#
# ## 语料根
#
# 全部在 `comem://user/lin` 下。评估执行器按语料的根绑定服务图身份（`user:lin`），
# 换一个根只需要改这里的 URI。
#
# ## 与旧集合的关系
#
# 扩集之前的 34 条查询 / 23 篇语料冻结在 `eval/datasets/basic-v1.yaml`。这 23 篇里
# 有 22 篇与这里逐字相同；`resources/ttl-sweep.md` 在 basic 里补了「存在 expires_at
# 列里」一句（`expires_at` 标识符查询与「许可证过期」难负例需要这个词在语料里
# 有落点）。除此之外，「新集合 vs 旧集合」的分数差只反映**新增查询与新增语料**。

name: basic
description: >-
  CoMem 检索质量基线：105 条查询，覆盖中文双字词、同义改写、标识符、分级相关性与
  难负例。语料取自项目自身文档中的真实主题。

corpus:
  # ── 记忆：偏好 ──────────────────────────────────────────────────────────

  "comem://user/lin/memories/preferences/code-style.md": |
    代码风格偏好

    仓库统一使用 TypeScript 严格模式，tsconfig 里 strict 与 noUncheckedIndexedAccess 都打开。
    缩进两个空格，行宽 100 列。优先写纯函数，副作用集中在一处。
    不要为了少写一行而用 any 绕过类型检查；类型断言要能解释运行时值为什么一定成立。

  "comem://user/lin/memories/preferences/commit-message.md": |
    提交信息约定

    提交信息用中文，动词开头，一行不超过 72 个字符。正文说明动机与影响，不复述 diff。
    一个提交只做一件事；格式化与重构不要混在功能提交里。

  "comem://user/lin/memories/preferences/review-process.md": |
    代码评审流程

    小步提交，每次评审不超过 400 行。评审前在本地跑一遍 pnpm verify，确认类型检查、lint 与测试全绿。
    评审意见只针对改动，不针对人。争议超过两轮就开个短会，不要在同一条评论里来回拉锯。

  "comem://user/lin/memories/preferences/observability.md": |
    可观测性偏好

    日志每行一个 JSON，requestId 贯穿一次请求到后台任务与模型调用。
    延迟按阶段归因，不要只报一个总数。错误日志里带稳定错误码，方便按码聚合。

  "comem://user/lin/memories/preferences/api-response.md": |
    统一响应封套

    成功时返回 { result }，失败时返回 { error: { code, message, details } }。
    HTTP 状态码表示协议层的成败，code 是稳定的机器可读标识；message 给人看，details 放定位用的字段。
    不要在同一个接口里返回两种形状，否则客户端写不出通用的错误处理。

  "comem://user/lin/memories/preferences/config-discipline.md": |
    配置项纪律

    每个配置项必须有消费方。没有读取点的配置比报错更危险：它让人以为改了会生效。
    新增一项要同时改默认值、环境变量名与文档，pnpm check:config 会拦住没有读取点的孤儿项。
    环境变量统一 COMEM_ 前缀，嵌套段用下划线连接，环境变量优先于配置文件。

  "comem://user/lin/memories/preferences/documentation.md": |
    文档写作规范

    先给结论或结果，再给证据与注意事项。用简单、事实性的完整句子，少用指代词，直接写出被指代的对象。
    只在区分易混概念或防止误操作时保留「是……不是……」的对比。
    来源不确定时明确说明不确定，不要编造依据。

  # ── 记忆：实体 ──────────────────────────────────────────────────────────

  "comem://user/lin/memories/entities/comem-project.md": |
    CoMem 项目

    CoMem 是面向 AI agent 的上下文记忆数据库。给 agent 一个稳定地址 comem://，让它在不同会话、
    不同机器、不同队友之间共享已经知道的东西。技术栈是 TypeScript、Fastify 与 SQLite
    （FTS5 与 sqlite-vec）。

  "comem://user/lin/memories/entities/sqlite-vec.md": |
    sqlite-vec 向量扩展

    sqlite-vec 提供 vec0 虚拟表，做的是暴力 KNN 检索，没有 ANN 索引。
    一万条 1024 维向量大约 8 到 10 毫秒；候选集超过一万条时会先撞上全量 URI 过滤的成本。

  "comem://user/lin/memories/entities/bge-m3.md": |
    bge-m3 嵌入模型

    bge-m3 输出 1024 维向量，支持中英文。换模型时 node_embedding 的维度必须跟着改，
    否则启动就报维度不一致。维度写错不会静默降级，第一次写入就会失败。

  "comem://user/lin/memories/entities/rerank-model.md": |
    重排模型

    重排用 bge-reranker-v2-m3，一次最多送 50 条候选，超时 10 秒。
    重排是检索路径上的额外模型调用，默认关闭。开启后按重排分数保留前 keepTopN 条。

  "comem://user/lin/memories/entities/mcp-tools.md": |
    MCP 工具清单

    对外只暴露 16 个工具：10 个只读、4 个写、2 个摄取。find 与 search 的差别只有「是否先做查询意图分析」，
    rule_search 的阈值是相对于本次最高分的比例，不是绝对分数下限。
    ACL 的两个工具不进 MCP——能给自己授权的 agent 就是提权漏洞，只走 Web 与 HTTP。
    加第 17 个工具之前先确认现有工具确实覆盖不了。

  "comem://user/lin/memories/entities/recall-ledger.md": |
    召回账本

    账本按作用域分片，条目按会话过滤：同一用户的两个会话不能共用一个轮次时钟，否则新会话前几轮会被静默压制。
    去重窗口是「本会话最近 dedup_turns 轮投过什么」，只记真的给了正文的条目，只给 URI 的不记。
    轮次时钟取消息总数，按 turn - 4 × dedup_turns 裁剪，上限 500 条。

  "comem://user/lin/memories/entities/context-assembly.md": |
    上下文组装

    检索结果到模型输入之间还有一层：按 token 预算分层投放。events 从 L1 概览起步，其余从 L0 摘要起步，
    放不下就沿 L2 → L1 → L0 → 只有 URI 降级，降到底还放不下就丢弃并计数。
    然后是去重（同一次请求内）与配额（chat / coding 两套预设按类别分配条目数）。

  "comem://user/lin/memories/entities/uri-canonicalization.md": |
    URI 规范化

    规范化必须唯一：段做 NFC、合并重复斜杠、去掉末尾斜杠、拒绝 . 与 ..、拒绝控制字符与反斜杠、
    单段不超过 255 字节、保留名不能当普通文件名。权限按路径记录，同一个文件有两个路径就有两套权限。
    大小写不折叠——comem://user/Alice 与 comem://user/alice 是两个用户。

  "comem://user/lin/memories/entities/metadata-files.md": |
    元数据文件

    每个目录可以带 .acl.json（权限）、.abstract.md（L0 摘要）、.overview.md（L1 概览）。
    归档目录多 .meta.json、memory_diff.json 与 .done，其中 .done 是唯一的完成信号，最后写。
    这些名字是保留名，不能当普通文件名。索引是派生数据，删掉 _meta 下的库跑一次重建即可恢复。

  # ── 记忆：经历 ──────────────────────────────────────────────────────────

  "comem://user/lin/memories/experiences/monorepo-migration.md": |
    多仓库迁移到 monorepo 的教训

    一开始把所有包都塞进一个 workspace，构建时间从两分钟涨到十五分钟。
    后来按发布节奏拆成三个 workspace，每个包只依赖自己需要的构建产物。
    迁移脚本要能重复执行，中途失败时知道停在哪一步，不要留下半套目录。

  "comem://user/lin/memories/experiences/cache-invalidation.md": |
    缓存失效的教训

    缓存键里一定要带数据版本。曾经用文件名当键，文件内容改了但键没变，读出来的是旧数据。
    失效用删除而不是覆盖：覆盖会留下一个永远不会被读到的旧值。

  "comem://user/lin/memories/experiences/lock-contention.md": |
    路径锁竞争

    两把锁按 URI 字符串排序后获取，避免两个相反方向的移动互相等待。
    互为祖先的路径直接拒绝：移动 a 到 a/b 会在拿第二把锁时等自己，最后报一个误导性的超时。

  "comem://user/lin/memories/experiences/summary-stale.md": |
    摘要一直显示待刷新

    先看 node 表的 summary_pending 与 summary_baseline：计数到不了阈值就只记脏不重算，这是设计行为。
    小目录（直接子项不超过 32 条）或 pendingChanges / totalEntries 达到 0.10 会立刻重算。
    对账脚本可以用 SummaryService.regenerate 从指定目录往上重算整条链。

  "comem://user/lin/memories/experiences/search-miss.md": |
    刚写的内容搜不到

    先确认写的是记忆还是普通文件：只有带 memory_type 的写入会进摘要与检索，会话消息按设计不进索引。
    再确认 status 是不是 pending——待复核的 experiences 与 rules 不参与检索，通过复核才变成 active。
    最后才看嵌入：供应商不可用时语义那条路会降级，此时只有关键词能命中。
    故障排查按这个顺序走，三步都正常才是真的检索失败。

  "comem://user/lin/memories/experiences/session-403.md": |
    会话页返回 403

    403 不是「没有会话」，是「没有权限」。会话目录挂在根下，根预置只给 owner manage，
    用别人的身份打开会拿到 403 而不是空列表——空列表和没有权限是两件事。
    先看请求头里的身份有没有被正确解析，再看根预置的 ACL 条目是不是被删掉了。

  "comem://user/lin/memories/experiences/dev-port.md": |
    pnpm dev 起不来的几种情况

    端口被占用时 pnpm dev 会明确报错，不会把控制台接到别的服务上；两边一起换端口用 COMEM_SERVER_PORT。
    控制台是独立包，忘了在 web/ 下装依赖时它起不来，后端却是好的。数据根不可写会让迁移直接失败。

  # ── 记忆：规则 ──────────────────────────────────────────────────────────

  "comem://user/lin/memories/rules/license-review.md": |
    依赖许可证检查

    引入新依赖前检查许可证。AGPL-3.0 与项目兼容，但 GPL 系要单独确认。
    不确定时先读 LICENSE 全文，不要只看 package.json 里的字段。

  "comem://user/lin/memories/rules/no-silent-degradation.md": |
    降级必须可见

    任何降级都要写日志，并把原因带回给调用方。静默降级会让真实缺陷看起来像正常状态。
    模型超时、嵌入失败、重排不可用都走这条规则：返回结果，同时带 reason。

  "comem://user/lin/memories/rules/no-any.md": |
    不要用 any 绕过类型检查

    需要收窄时用 unknown 再写类型守卫，不要 any 加断言。类型断言要能解释运行时值为什么一定成立。
    strict 与 noUncheckedIndexedAccess 都开着，索引访问返回联合类型不是麻烦，是问题被提前暴露。

  "comem://user/lin/memories/rules/clean-room.md": |
    参考实现不能出现在交付物里

    可以读成熟实现的代码与设计来对齐质量，但交付物中不得出现它的名字、代码片段、文件路径或提交信息。
    需要记录对比时写进本地笔记，不进版本控制。直接复制粘贴不算自己写出来的实现。

  "comem://user/lin/memories/rules/irreversible-ask.md": |
    停下来问的三种情况

    范围变更或不可逆操作、前提事实有误或需求互相矛盾、需要本地拿不到的凭据与环境——这三类先问，不要自己拍。
    其余的实现路径、风格偏好、细节取舍自己决定，并记进决策记录。

  "comem://user/lin/memories/rules/no-fake-result.md": |
    不要为了演示产出假结果

    一个永远返回空列表的接口，比一个明确报错的接口更难发现。假实现的代价不是以后重写，
    而是让真实缺陷看起来像正常状态。演示用合成数据时要标明是合成的，不要让读数被当成测量结果。

  # ── 资料 ────────────────────────────────────────────────────────────────

  "comem://user/lin/resources/fts5-segmentation.md": |
    中文检索的分词问题

    unicode61 按 Unicode 类别切词，连续的汉字会被当成一个巨型 token，只有整段原样查询才命中。
    trigram 支持子串，但要求至少三个字符，中文双字词（记忆、偏好）全部落空。
    做法是索引与查询两侧都做 CJK 单字切分，再按短语匹配。

  "comem://user/lin/resources/rrf-fusion.md": |
    倒数排名融合

    RRF 用名次而不是分数做融合：score = 1 / (k + rank)，k 取 60。
    BM25 的分数无界，向量余弦在 -1 到 1 之间，直接相加前要归一化，而归一化依赖当次候选集。
    只用名次就没有这个问题。k 越大，前几名之间的差距越小。

  "comem://user/lin/resources/level-weighting.md": |
    层级加权

    L0 摘要权重 1.15，L1 概览 1.05，L2 原文 1.00。
    加权只用来在 BM25 分数接近时打破平局，不应该压过词频。这几个数字是经验假设，没有实测数据。

  "comem://user/lin/resources/sqlite-binding-limit.md": |
    SQLite 绑定变量上限

    SQLite 单条语句的绑定变量有上限，候选集大时要分批查询。URI_CHUNK_SIZE 取 500，是留了余量的保守值。
    批次之间要合并成全局前 k 名，不能每批各取 k 条再拼接。

  "comem://user/lin/resources/context-window-budget.md": |
    上下文预算

    注入模型的上下文默认 1600 tokens。单条候选最多占平均值的两倍，超出就降级到下一层。
    放不下的条目先降级再丢弃，丢弃的数量要计数，不能静默少给。

  "comem://user/lin/resources/acl-materialization.md": |
    权限物化

    这个节点对谁能做什么，在写 ACL 时算好，存进 node_permission 表。检索时就是一个普通的 EXISTS 子查询。
    写时算、读时查：读是高频操作，改 ACL 是低频操作。
    路径范围用 GLOB 而不是 LIKE，因为 LIKE 对 ASCII 大小写不敏感，会把 Alice 的子树算进 alice。

  "comem://user/lin/resources/ttl-sweep.md": |
    记忆过期清扫

    TTL 只做软过期：把 status 改成 archived，不物理删除文件。
    过期时间存在 expires_at 列里，是绝对时刻，不存 N 天后。清扫按批处理，每批最多 100 条，避免一次锁住数据库。

  "comem://user/lin/resources/memoization.md": |
    记忆化（memoization）

    记忆化是把函数的计算结果缓存起来，下次用同样的参数调用时直接返回。
    它和上下文记忆是两回事：前者是进程内的性能优化，后者是跨会话的知识存储。

  "comem://user/lin/resources/prompt-override.md": |
    提示词覆盖

    提示词的静态骨架在 prompts/*.md，动态部分由服务层渲染成字符串再用占位符注入，不在代码里拼。
    控制台改过的模板优先于仓库里的默认值，改完下一次生成就生效，不需要重启。
    升级后要检查「我的覆盖落后了」：默认模板加了新占位符而覆盖里没有，渲染出来就少一段。

  "comem://user/lin/resources/backup-restore.md": |
    备份与恢复

    要备两样东西：内容目录（Markdown 与附件）和 _meta 下的 SQLite 库。只备内容时索引可以重建，
    只备库时文件没了就什么都恢复不了。恢复后先跑一次重建索引，再确认摘要有没有降级。
    停机备份最省事：拷贝时不要有写入，否则库可能拿到半写状态。

  "comem://user/lin/resources/health-metrics.md": |
    健康检查与指标

    /health 返回服务状态、当前身份、可寻址的根、索引条数与摘要降级标记，是给 agent 拼绝对地址用的。
    /metrics 是 Prometheus 文本格式，指标名带单位后缀，接监控时直接抓这个端点。延迟按阶段归因，不要只报一个总数。
    健康检查不要依赖外部供应商——供应商挂了服务本身还是健康的，那属于降级标记。

  "comem://user/lin/resources/ingest-cursor.md": |
    导入游标

    「读到哪」记在 _meta 库的 ingest_cursor 表里，主键是来源加原生会话 ID。
    同一个来源跑第二次全部计入跳过，不产生重复会话；想重导某个会话就删掉对应行。
    游标按会话推进，不是按文件字节偏移——导出的对话文件会追加。

  "comem://user/lin/resources/review-gate.md": |
    复核闸门

    experiences 与 rules 写入时是 pending，不参与检索；人工通过才变成 active，拒绝则删除并记录原因。
    其余记忆类型直接 active。只报总数会让人以为「导进来一百条，一百条都能搜到」，
    实际有一部分要过闸门，报告里要分开写。

  "comem://user/lin/resources/group-sharing.md": |
    组空间的三层共享

    组内全员可读写就在组根预置 group:{gid} = write；个人文件给全组看就在该节点挂 group 的 read；
    只给组里几个人看就在更深节点设 restricted 切断继承，再挂具体用户的直接授权。
    退组立即生效，因为 ACL 存的是组标识而不是展开后的成员列表。

  "comem://user/lin/resources/project-scope.md": |
    项目作用域

    项目是根下面的二级命名空间，结构跟根同构，少 sessions 与 projects 两段。
    项目 ID 从 git origin 派生：把非字母数字换成连字符；不在仓库里时用目录名。
    同一个仓库的不同克隆、worktree、子目录都归到同一个项目，可以用 .comem/config.json 显式指定。

  "comem://user/lin/resources/query-filter.md": |
    查询过滤

    用户的 prompt 里混着斜杠命令、@ 文件提及、代码块、URL 与「继续」这类无实质内容，
    先过一组 sed 风格的正则替换再检索。分隔符和正则里的元字符会打架，pattern 里的竖线要转义。
    过滤后为空就不检索——拿空串去查会返回随机结果。

  "comem://user/lin/resources/bypass.md": |
    临时关掉记忆

    演示想对比「有记忆 / 没记忆」、调试想隔离变量、这段对话不该入库，三种场景要临时关掉记忆。
    整个会话关掉用 COMEM_BYPASS_SESSION，只关一部分路径用它的 PATTERNS 变体（glob 里的 * 跨 /）。
    生效位置在 Hook 层：注入与采集都跳过，服务端不知道有这回事，它只是没收到请求。

  "comem://user/lin/resources/hybrid-candidates.md": |
    候选放大与截断

    先取 limit × 4 条候选，权限过滤与去重之后再截到 limit。只取 limit 条时，
    前几条没权限就会返回不足数，用户看到「没有结果」而实际上有。
    多路召回按 URI 去重取最高分，排序与截断只能在合并之后做。

  "comem://user/lin/resources/session-archive.md": |
    会话提交的两阶段

    阶段一在请求内做完：分配归档序号、写 messages.jsonl、写 .meta.json、建 task 然后返回 taskId。
    阶段二在后台跑四个步骤：归档摘要、抽取记忆、应用补丁、标记祖先摘要失效。
    自动提交有五个阈值，未提交 token 与消息数都是严格大于才触发，minCommitIntervalSeconds 是全局闸门。
    归档时用 keepRecentCount 保留最近 N 条，序号 archive_NNN 单调递增、从不复用。

  "comem://user/lin/resources/task-recovery.md": |
    任务恢复

    认领用一条带条件的 UPDATE 拿到租约，租约 60 秒，心跳每 20 秒续一次。
    多个执行器并发认领时靠这条 UPDATE 的原子性保证同一条任务只被认领一次。
    进程崩了之后启动扫描把过期的 running 重置成 pending，尝试次数加一；超过 3 次置为 failed 并写错误。
    重试必须幂等：记忆操作重复应用会造出重复记录，所以已完成步骤记在 steps_done 里。

  "comem://user/lin/resources/patch-merge.md": |
    补丁合并

    同 URI 的多条 patch 按输出顺序应用，不调模型：第 2 条的 SEARCH 在第 1 条应用后的正文上匹配。
    SEARCH 必须唯一命中，命中零处或多处整条失败并记进 skippedOperations，不做模糊匹配。
    同一批次里既 upsert 又 delete 同一 URI 时保留 upsert，视为误判。

  # ── 技能 ────────────────────────────────────────────────────────────────

  "comem://user/lin/skills/deploy-checklist.md": |
    部署检查清单

    上线前跑 pnpm verify，确认类型检查、lint、单元测试与集成测试全绿。
    然后检查健康检查端点、数据库迁移版本、备份目录可写。最后确认回滚步骤。

  "comem://user/lin/skills/release-steps.md": |
    发布步骤

    先打 tag，再用 tag 生成变更日志，最后构建镜像并推送到镜像仓库。
    发布后观察十分钟的错误率与延迟，异常就回滚到上一个 tag。

