# CoMem 的完整部署形态：后端 + 控制台 + 本地推理 + 反向代理。
#
# 它解决两个光靠 Dockerfile 解决不了的问题：
#
# 1. **控制台与 API 必须同源。** 控制台的 Nuxt 构建产物里 apiBase 是相对路径
#    `/api/v1`，浏览器会把它打到控制台自己的 origin 上；Nitro 的生产 server 不
#    代理 /api（devProxy 只在 `nuxt dev` 生效）。没有反向代理时，控制台能打开，
#    但每个请求都 404。这里用 nginx 把 /api、/health、/metrics、/mcp 转给后端，
#    其余转给控制台。
# 2. **本地推理与后端是两种运行时。** 一个 Node，一个 Python + llama.cpp；
#    镜像里都装了，但应该各起一个进程，而不是塞进同一个容器的 entrypoint。
#
# 用法：
#   cp config.example.yaml config.yaml     # 填 providers 的 key（或留空跑离线）
#   docker compose build
#   docker compose up -d
#   curl http://127.0.0.1:18080/health
#
# 端口全部绑在 127.0.0.1，不监听宿主机外部地址。要对外提供服务，前面还有一层
# 真正的入口（TLS、认证），见 docs/operations.md「Docker 部署」。

name: comem

services:
  # 后端：HTTP API + MCP Streamable HTTP。
  comem:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 0 = 按构建机 CPU 指令集编译（默认，在目标机上 build）
        # 1 = 多 ISA 变体（CI 构建后分发到不同 CPU 必须用这个）
        COMEM_PORTABLE_CPU: "${COMEM_PORTABLE_CPU:-0}"
    image: "comem:${COMEM_TAG:-local}"
    init: true
    restart: unless-stopped
    environment:
      # 镜像默认已经是 0.0.0.0；显式写出来是为了让 `docker compose config`
      # 能看见「监听地址」这个部署参数。
      COMEM_SERVER_HOST: 0.0.0.0
      # `config.example.yaml` 里 providers 用 `${COMEM_LLM_KEY}` 这类占位符引用
      # 环境变量。这里透传，密钥放宿主环境或同目录的 `.env`（compose 自动读取），
      # 不要写进这个文件。留空时服务能启动，模型调用会降级（见 operations.md）。
      COMEM_LLM_KEY: "${COMEM_LLM_KEY:-}"
      COMEM_EMBEDDING_KEY: "${COMEM_EMBEDDING_KEY:-}"
    volumes:
      # 数据根：内容文件 + SQLite 索引 + 提示词覆盖。
      - comem-data:/var/lib/comem
      # 镜像里没有 config.yaml（见 .dockerignore）。配置靠挂载提供；
      # 也可以完全不用文件、只用 COMEM_* 环境变量。
      - "${COMEM_CONFIG_FILE:-./config.yaml}:/etc/comem/config.yaml:ro"
    ports:
      # 直连后端，调试用；正常入口是下面的 proxy。
      - "127.0.0.1:${COMEM_BACKEND_PORT:-18081}:1933"
    # 探活继承镜像里的 HEALTHCHECK：端口从 --config 读，不硬编码。

  # 控制台：同一个镜像，换一个命令起 Nitro 的 SPA server。
  console:
    image: "comem:${COMEM_TAG:-local}"
    init: true
    restart: unless-stopped
    command: ["node", "web/.output/server/index.mjs"]
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3081"
    ports:
      - "127.0.0.1:${COMEM_CONSOLE_PORT:-18082}:3081"
    depends_on:
      comem:
        condition: service_healthy

  # 本地推理：OpenAI 兼容的 /v1/embeddings + Cohere 兼容的 /v1/rerank。
  # 模型权重（1.28GB）不进镜像，从宿主目录只读挂载到 /models。
  inference:
    image: "comem:${COMEM_TAG:-local}"
    init: true
    restart: unless-stopped
    entrypoint: ["/opt/comem-inference/.venv/bin/python", "/app/local-inference/server.py"]
    command:
      - "--device"
      - "${COMEM_INFERENCE_DEVICE:-cpu}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8089"
      - "--embedding-model"
      - "/models/Qwen3-Embedding-0.6B-Q8_0.gguf"
      - "--rerank-model"
      - "/models/qwen3-reranker-0.6b-q8_0.gguf"
    volumes:
      - "${COMEM_MODELS_DIR:-./local-inference/models}:/models:ro"
      # 纯 CPU 部署时 server.py 会设 GGML_VK_VISIBLE_DEVICES="" 隐藏 Vulkan 设备，
      # 这是「CPU 推理退化到单线程」的规避，不是配置错误。
    # Vulkan 需要渲染节点。只有 COMEM_INFERENCE_DEVICE=gpu 时才用得到；
    # 纯 CPU 部署可以删掉 devices / group_add。
    devices:
      - "/dev/dri:/dev/dri"
    # 容器里的 node 用户（uid 1000）要能打开 renderD128，需要宿主 render 组的 GID。
    # 宿主机上查：stat -c '%g' /dev/dri/renderD128
    group_add:
      - "${COMEM_RENDER_GID:-989}"
    # Vulkan 的驱动会 mmap 一大块共享内存；默认 64MB 的 /dev/shm 在
    # 多 batch 推理时会不够。
    shm_size: "256mb"
    healthcheck:
      test:
        - "CMD"
        - "/opt/comem-inference/.venv/bin/python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8089/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  # 反向代理：同源地把 API 与控制台拼在一起。
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COMEM_HTTP_PORT:-18080}:80"
    configs:
      - source: comem-nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      comem:
        condition: service_healthy
      console:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  comem-data:

# 内联 nginx 配置：不额外落一个 nginx.conf 文件，compose 自己管理生命周期。
# `configs.content` 需要 Docker Compose >= 2.23。
configs:
  comem-nginx:
    content: |
      server {
        listen 80;
        server_name _;

        # 后端：HTTP API、运维端点、MCP。MCP 是 Streamable HTTP（SSE），
        # 必须关 buffering 并放大读超时，否则事件流会被 nginx 攒着不发。
        location ~ ^/(api|health|metrics|mcp)(/|$) {
          proxy_pass http://comem:1933;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header X-Request-Id $$request_id;
          proxy_buffering off;
          proxy_cache off;
          proxy_read_timeout 1h;
          proxy_send_timeout 1h;
        }

        # 控制台：Nuxt 的 SPA server。页面路由（/files、/search…）由它兜底。
        location / {
          proxy_pass http://console:3081;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
        }
      }
