          {
            name: 'rules', open: true, meta: '3', children: [
              {
                name: 'code-review', open: true, meta: '3', children: [
                  { name: 'no-unrequested-refactor.md', uri: 'comem://user/alice/memories/rules/code-review/no-unrequested-refactor.md', meta: '1.1 K' },
                  { name: 'ts-strict-null.md', uri: 'comem://user/alice/memories/rules/code-review/ts-strict-null.md', meta: '860 B' },
                  { name: 'test-name-states-behavior.md', uri: 'comem://user/alice/memories/rules/code-review/test-name-states-behavior.md', meta: '720 B' }
                ]
              }
            ]
          }
        ]
      },
      { name: 'resources', meta: '24', cut: true, children: [{ name: '…', sidecar: true, meta: '' }] },
      { name: 'skills', meta: '6' },
      { name: 'sessions', meta: '9' }
    ]
  },
  {
    name: 'group/eng', open: true, children: [
      {
        name: 'memories', open: true, children: [
          { name: '.abstract.md', sidecar: true, meta: '204 B' },
          { name: 'platform-conventions.md', uri: 'comem://group/eng/memories/platform-conventions.md', meta: '2.8 K' },
          { name: 'release-checklist.md', uri: 'comem://group/eng/memories/release-checklist.md', meta: '3.2 K' }
        ]
      },
      { name: 'resources', meta: '8' },
      { name: 'skills', meta: '3' }
    ]
  }
];

function rowHTML(node, depth) {
  const isDir = !!node.children;
  const nameCls = isDir ? 'tname dir' : 'tname';
  const cut = node.cut ? `<span class="cut" title="restricted 边界">⊘</span>` : '';
  const caret = isDir ? '›' : '';
  return `<div class="tr${node.sel ? ' is-sel' : ''}" data-name="${node.name.toLowerCase()}" ${node.uri ? `data-uri="${node.uri}"` : ''} ${isDir ? `data-dir="1"` : ''}>
    <span class="caret${isDir ? '' : ' blank'}">${caret}</span>
    <span class="tico">${CoMem.icon(isDir ? 'folder' : (node.sidecar ? 'dot' : 'file'), 11)}</span>
    <span class="${nameCls}" style="${node.sidecar ? 'color:var(--ink-4)' : ''}">${node.name}</span>
    ${cut}
    <span class="tmeta">${node.meta || ''}</span>
  </div>`;
}

function renderTree(nodes, depth = 0) {
  return nodes.map((n) => {
    if (!n.children) return rowHTML(n, depth);
    return `<details class="tn" ${n.open ? 'open' : ''}>
      <summary>${rowHTML(n, depth)}</summary>
      <div class="tc">${renderTree(n.children, depth + 1)}</div>
    </details>`;
  }).join('');
}

/* ==========================================================================
   详情渲染
   ========================================================================== */

const LAYER_NOTE = [
  'L0 摘要 · 上限 256 字符。agent 先读这一层判断相关性，读不到正文。',
  'L1 概览 · 上限 4000 字符。目录级上下文，用来决定要不要展开 L2 原文。',
  'L2 原文 · 完整文档。只有前两层判断为相关时才会读到这里。'
];

let currentUri = 'comem://user/alice/memories/preferences/code-style.md';
let currentLayer = 0;

function crumbHTML(uri) {
  const parts = uri.replace('comem://', '').replace(/\/$/, '').split('/');
  let acc = '';
  return `<a href="filesystem.html">comem://</a>` + parts.map((p, i) => {
    acc += p + (i < parts.length - 1 ? '/' : '');
    return `<span class="sep">/</span><a href="filesystem.html">${p}</a>`;
  }).join('').replace('<span class="sep">/</span>', '');
}

function freshHTML(f) {
  const stale = f.state === 'stale';
  const pct = Math.min(100, Math.round((f.pending / Math.max(f.total, 1)) * 100));
  return `<div class="fresh ${stale ? 'is-stale' : 'is-fresh'}">
    <div class="fresh-head">
      ${CoMem.icon(stale ? 'alert' : 'check', 13)}
      <span>${stale ? '摘要待刷新' : '摘要为最新'}</span>
    </div>
    <p>${f.note}</p>
    <div class="fresh-gauge">
      <span class="v tnum">${f.pending}/${f.total}</span>
      <span class="track"><i style="width:${pct}%"></i></span>
      <span class="v tnum">${pct}%</span>
    </div>
    <div class="hint" style="margin-top:7px">重算阈值 ${f.threshold}%${f.task ? ` · ${f.task}` : ''}</div>
  </div>`;
}

function layerBodyHTML(d) {
  if (currentLayer === 0) {
    return `<div class="abstract-card">
      <div class="ac-meta">
        <span>L0 · ABSTRACT</span>
        <span style="color:var(--line-3)">|</span>
        <span>${d.l0meta.by}</span>
        <span style="color:var(--line-3)">|</span>
        <span>${d.l0meta.at}</span>
      </div>
      <p>${d.l0}</p>
      <div class="ac-len">${d.l0meta.chars} / 256 字符 · 模型 ${d.l0meta.model}</div>
    </div>`;
  }
  if (currentLayer === 1) {
    return `<div class="md">${d.l1}</div>
      <div class="hint" style="margin-top:14px">${d.l1meta.chars} / ${d.l1meta.max} 字符 · 超过上限时按条目截断并标注</div>`;
  }
  return `<div class="md">${d.l2}</div>`;
}

function renderDetail() {
  const d = DOCS[currentUri];
  if (!d) return;
  const pane = document.getElementById('detailPane');
  const isDir = d.kind === 'directory';

  pane.innerHTML = `<div class="detail">
    <div class="detail-main">
      <div class="crumb">${crumbHTML(d.uri)}</div>

      <div class="doc-head">
        <div style="min-width:0;flex:1">
          <h1 class="doc-title">${CoMem.esc(d.title)}</h1>
          <div class="doc-uri uri" data-copy="${d.uri}">${d.uri}</div>
        </div>
        <button class="btn btn-sm" id="btn-download">${CoMem.icon('copy', 12)} 复制 URI</button>
      </div>

      <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;align-items:center">
        <span class="badge badge-neutral">${isDir ? 'directory' : 'document'}</span>
        <span class="badge badge-neutral">${d.contextType}</span>
        ${d.memoryType ? `<span class="badge badge-accent">${d.memoryType}</span>` : ''}
        <span class="lvl" data-level="0" style="margin-left:6px"><span class="strata" data-level="0"><i></i><i></i><i></i></span><b>L0</b></span>
        <span class="faint small">→</span>
        <span class="lvl" data-level="1"><span class="strata" data-level="1"><i></i><i></i><i></i></span><b>L1</b></span>
        <span class="faint small">→</span>
        <span class="lvl" data-level="2"><span class="strata" data-level="2"><i></i><i></i><i></i></span><b>L2</b></span>
      </div>

      <div class="layerbar" role="tablist" aria-label="披露层级">
        ${[['L0', '摘要'], ['L1', '概览'], ['L2', '原文']].map(([k, t], i) => `
          <button role="tab" aria-selected="${i === currentLayer}" class="${i === currentLayer ? 'is-active' : ''}" data-layer="${i}">
            <span class="lb-k">${k}</span><span class="lb-t">${t}</span>
          </button>`).join('')}
      </div>

      <div class="layer-note">${CoMem.icon('info', 12)}<span>${LAYER_NOTE[currentLayer]}</span></div>
      <div class="layer-body">${layerBodyHTML(d)}</div>

      <div style="margin-top:28px;border-top:1px solid var(--line);padding-top:16px">
        <div class="sec-title" style="margin-bottom:12px">读取成本</div>
        <div class="cost">
          ${[d.l0meta.chars, d.l1meta.chars, d.bytes].map((chars, i) => {
            const max = Math.max(d.l0meta.chars, d.l1meta.chars, d.bytes);
            return `<div class="cost-row ${i === currentLayer ? 'is-on' : ''}">
              <span class="ck">L${i}</span>
              <span class="ct"><i style="width:${Math.max(2, Math.round((chars / max) * 100))}%"></i></span>
              <span class="cv">${chars.toLocaleString('en-US')} 字符</span>
            </div>`;
          }).join('')}
        </div>
        <p class="hint" style="margin-top:10px">agent 的典型路径是 L0 → L1 → L2。多数查询在 L1 就停止，只有确认相关才读原文。</p>
      </div>
    </div>

    <aside class="detail-rail">
      <div class="sec-title" style="margin-bottom:12px">摘要来源</div>
      <div class="meta-block">
        <div class="meta-row"><span class="mk">生成者</span><span class="mv mono" style="font-size:11px">${d.l0meta.by}</span></div>
        <div class="meta-row"><span class="mk">模型</span><span class="mv mono" style="font-size:11px">${d.l0meta.model}</span></div>
        <div class="meta-row"><span class="mk">生成于</span><span class="mv mono" style="font-size:11px">${d.fresh.generated}</span></div>
        <div class="meta-row"><span class="mk">触发</span><span class="mv mono" style="font-size:11px">会话提交 session_7c1a</span></div>
      </div>

      <div class="meta-block">
        <div class="sec-title" style="margin-bottom:10px">新鲜度</div>
        ${freshHTML(d.fresh)}
      </div>

      <div class="meta-block">
        <div class="sec-title" style="margin-bottom:10px">有效权限</div>
        <div style="display:grid;gap:7px">
          ${d.acl.map((a) => `<div style="display:flex;align-items:center;gap:8px;font-size:11px">
            <span class="mono" style="color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.p}</span>
            <span class="spacer" style="flex:1;height:1px;background:var(--line);opacity:.6;margin:0 2px"></span>
            <span class="mono lv-${a.lv}" style="font-size:10px">${a.lv}</span>
          </div>
          <div class="hint" style="margin:-3px 0 2px;padding-left:0">${a.src}</div>`).join('')}
        </div>
        <a class="btn btn-sm btn-ghost" href="acl.html" style="margin-top:8px;width:100%">在权限管理中打开 ${CoMem.icon('arrowUpRight', 11)}</a>
      </div>

      <div class="meta-block">
        <div class="sec-title" style="margin-bottom:10px">存储</div>
        <div class="meta-block" style="gap:6px">
          <div class="meta-row"><span class="mk">大小</span><span class="mv mono" style="font-size:11px">${d.size}</span></div>
          ${d.lines ? `<div class="meta-row"><span class="mk">行数</span><span class="mv mono" style="font-size:11px">${d.lines}</span></div>` : ''}
          ${d.writes ? `<div class="meta-row"><span class="mk">写入次数</span><span class="mv mono" style="font-size:11px">${d.writes}</span></div>` : ''}
          <div class="meta-row"><span class="mk">更新于</span><span class="mv mono" style="font-size:11px">${d.updated}</span></div>
        </div>
      </div>
    </aside>
  </div>`;

  pane.querySelectorAll('[data-layer]').forEach((b) => {
    b.addEventListener('click', () => {
      currentLayer = Number(b.dataset.layer);
      renderDetail();
    });
  });
  const copy = pane.querySelector('#btn-download');
  if (copy) copy.addEventListener('click', () => {
    if (navigator.clipboard) navigator.clipboard.writeText(d.uri).catch(() => {});
    CoMem.toast('已复制 URI');
  });
  pane.scrollTop = 0;
}

/* ==========================================================================
   初始化
   ========================================================================== */

document.addEventListener('DOMContentLoaded', () => {
  const tree = document.getElementById('tree');
  tree.innerHTML = renderTree(TREE);

  document.getElementById('btn-mkdir').innerHTML = CoMem.icon('plus', 14);
  document.getElementById('btn-refresh').innerHTML = CoMem.icon('retry', 14);
  document.getElementById('btn-refresh').addEventListener('click', () => CoMem.toast('索引已刷新 · 128 个条目'));

  /* 选中行 */
  tree.addEventListener('click', (e) => {
    const summary = e.target.closest('summary');
    const row = e.target.closest('.tr');
    if (!row) return;

    // 目录：点 caret 只展开/收起；点名称才进入详情
    const isDirRow = row.dataset.dir === '1';
    if (isDirRow && e.target.closest('.caret')) return;

    const uri = row.dataset.uri;
    if (!uri || !DOCS[uri]) {
      if (isDirRow) {
        // 目录本身没有编入演示数据，保持当前详情，只提示
        CoMem.toast('该目录未编入演示数据');
        if (summary) summary.parentElement.open = true;
        return;
      }
      // 文档：给出可解释的空态
      tree.querySelectorAll('.tr').forEach((r) => r.classList.remove('is-sel'));
      row.classList.add('is-sel');
      const name = row.querySelector('.tname').textContent;
      document.getElementById('detailPane').innerHTML = `<div style="padding:56px 32px;max-width:54ch">
        <div class="label" style="margin-bottom:10px">未编入演示数据</div>
        <h2 style="font-size:16px;font-weight:600;margin-bottom:8px">${CoMem.esc(name)}</h2>
        <p class="dim" style="font-size:12.5px;line-height:1.75">这条记录没有编入静态演示数据。演示稿只收录 6 个有代表性的节点，其余条目保留在树中，用来展示真实的目录密度与缩进层级。</p>
        <button class="btn btn-sm" id="btnBack" style="margin-top:16px">回到 code-style.md</button>
      </div>`;
      const back = document.getElementById('btnBack');
      if (back) back.addEventListener('click', () => {
        currentUri = 'comem://user/alice/memories/preferences/code-style.md';
        currentLayer = 0;
        tree.querySelectorAll('.tr').forEach((r) => r.classList.toggle('is-sel', r.dataset.uri === currentUri));
        renderDetail();
      });
      return;
    }

    tree.querySelectorAll('.tr').forEach((r) => r.classList.remove('is-sel'));
    row.classList.add('is-sel');
    currentUri = uri;
    currentLayer = 0;
    renderDetail();
    if (summary) summary.parentElement.open = true;
  });

  /* 键盘 1 / 2 / 3 切层 */
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea')) return;
    if (['1', '2', '3'].includes(e.key)) {
      currentLayer = Number(e.key) - 1;
      renderDetail();
    }
  });

  /* 树筛选 */
  const filter = document.getElementById('treeFilter');
  filter.addEventListener('input', () => {
    const q = filter.value.trim().toLowerCase();
    tree.querySelectorAll('details.tn').forEach((d) => { d.open = true; });
    tree.querySelectorAll('.tr').forEach((r) => {
      const hit = !q || r.dataset.name.includes(q);
      r.style.display = hit ? '' : 'none';
    });
    if (!q) {
      // 恢复默认展开状态
      tree.innerHTML = renderTree(TREE);
    }
  });

  renderDetail();
});
</script>
</body>
