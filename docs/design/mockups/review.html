let selected = ITEMS[0].id;
let filterType = 'all';
const reviewed = new Set();

/* ==========================================================================
   渲染
   ========================================================================== */

const TYPE_LABEL = { experience: '经验', rule: '规则' };

function visibleItems() {
  return ITEMS.filter((i) => !reviewed.has(i.id) && (filterType === 'all' || i.type === filterType));
}

function renderList() {
  const items = visibleItems();
  document.getElementById('pendCount').textContent = ITEMS.length - reviewed.size;
  document.getElementById('list').innerHTML = items.map((i) => `
    <div class="lrow ${i.id === selected ? 'is-sel' : ''}" data-id="${i.id}">
      <div class="lrow-main">
        <div class="lrow-top">
          <span class="badge ${i.type === 'rule' ? 'badge-info' : 'badge-accent'}">${TYPE_LABEL[i.type]}</span>
          <span class="lrow-t">${i.title}</span>
        </div>
        <div class="lrow-m">
          <span>${i.archive}</span>
          <span style="color:var(--line-3)">·</span>
          <span>${i.ago}</span>
          <span style="color:var(--line-3)">·</span>
          <span>${i.merge}</span>
        </div>
      </div>
    </div>`).join('') || `<div style="padding:28px 16px;text-align:center">
      <div class="label" style="margin-bottom:6px">队列已清空</div>
      <p class="hint" style="margin:0">当前筛选条件下没有待复核记录。</p>
    </div>`;
}

function renderDetail() {
  const item = ITEMS.find((i) => i.id === selected) || visibleItems()[0];
  const pane = document.getElementById('reviewPane');
  if (!item) {
    pane.innerHTML = `<div style="display:grid;place-items:center;height:100%;padding:40px;text-align:center">
      <div>
        <div class="label" style="margin-bottom:8px">全部处理完毕</div>
        <p class="dim" style="font-size:12.5px;max-width:36ch;line-height:1.7">5 条待复核记录已全部分流，管线回到空闲。新的记忆会在下次会话提交后进入队列。</p>
      </div></div>`;
    return;
  }

  const diffHTML = item.diff.map((l) => `
    <div class="dl ${l.t}">
      ${l.t === 'hunk' ? '<span class="ln"></span><span class="sig">@@</span>' : `<span class="ln">${l.n ?? ''}</span><span class="sig">${l.t === 'add' ? '+' : l.t === 'del' ? '−' : ' '}</span>`}
      <span class="tx">${CoMem.esc(l.text).replace(/\*([^*]+)\*/g, '<b style="color:var(--ink)">$1</b>')}</span>
    </div>`).join('');

  const added = item.diff.filter((l) => l.t === 'add').length;
  const removed = item.diff.filter((l) => l.t === 'del').length;

  pane.innerHTML = `
    <div style="flex:1;overflow:auto">
      <div style="padding:16px 22px 22px">
        <div class="crumb">
          <a href="review.html">记忆复核</a><span class="sep">/</span><span>${TYPE_LABEL[item.type]}</span>
        </div>

        <div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap">
          <div style="flex:1;min-width:240px">
            <h1 class="doc-title">${item.title}</h1>
            <div class="uri" data-copy="${item.uri}" style="margin-top:4px">${item.uri}</div>
          </div>
          <span class="badge ${item.type === 'rule' ? 'badge-info' : 'badge-accent'}">${TYPE_LABEL[item.type]}</span>
          <span class="badge badge-warn">pending</span>
        </div>

        <p class="dim" style="font-size:12.5px;margin-top:12px;line-height:1.65;max-width:76ch">${item.summary}</p>

        <!-- 元数据条 -->
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:16px">
          <div style="background:var(--surface);padding:9px 12px">
            <div class="label" style="font-size:8.5px">来源会话</div>
            <div class="mono" style="font-size:11px;color:var(--ink-2);margin-top:3px">${item.session}</div>
          </div>
          <div style="background:var(--surface);padding:9px 12px">
            <div class="label" style="font-size:8.5px">归档</div>
            <div class="mono" style="font-size:11px;color:var(--ink-2);margin-top:3px">${item.archive}</div>
          </div>
          <div style="background:var(--surface);padding:9px 12px">
            <div class="label" style="font-size:8.5px">抽取时间</div>
            <div class="mono" style="font-size:11px;color:var(--ink-2);margin-top:3px">${item.at}</div>
          </div>
          <div style="background:var(--surface);padding:9px 12px">
            <div class="label" style="font-size:8.5px">合并策略</div>
            <div class="mono" style="font-size:11px;color:var(--ink-2);margin-top:3px">${item.merge}</div>
          </div>
        </div>

        <!-- 规则字段 -->
        ${item.fields ? `
        <div style="margin-top:20px">
          <div class="sec-title" style="margin-bottom:4px">规则字段</div>
          <div style="border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:2px 14px">
            ${item.fields.map((f) => `<div class="field-row">
              <div class="fk">${f.k}</div>
              <div class="fv">${f.v}</div>
            </div>`).join('')}
          </div>
          <p class="hint" style="margin-top:8px">
            <b class="mono" style="color:var(--ink-2)">applies_when</b> 与 <b class="mono" style="color:var(--ink-2)">exception</b>
            只在 <span class="mono">rule_search</span> 按任务上下文召回时求值，不参与普通全文检索。生效前请确认条件写得足够窄。
          </p>
        </div>` : ''}

        <!-- diff -->
        <div style="margin-top:20px">
          <div class="sec-title" style="margin-bottom:8px">
            before / after
            <span class="badge badge-neutral" style="margin-left:auto;text-transform:none;letter-spacing:0">
              <span style="color:var(--ok)">+${added}</span>
              <span style="color:var(--line-3)">/</span>
              <span style="color:var(--err)">−${removed}</span>
            </span>
          </div>
          <div class="diff">
            <div class="diff-h">
              <span>${item.title}</span>
              <span style="flex:1"></span>
              <span class="add">+${added}</span><span class="del">−${removed}</span>
              <span>patch</span>
            </div>
            ${diffHTML}
          </div>
        </div>

        <!-- 来源对话 -->
        <div style="margin-top:20px">
          <div class="sec-title" style="margin-bottom:8px">抽取依据 · 来源对话</div>
          <div style="border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden">
            ${item.quotes.map((q) => `<div style="display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)">
              <span class="mono" style="font-size:9.5px;color:var(--ink-4);flex:0 0 56px;padding-top:2px;letter-spacing:.05em">${q.role}</span>
              <span style="font-size:12px;color:var(--ink-2);line-height:1.6">${q.text}</span>
            </div>`).join('')}
          </div>
        </div>

        <!-- 影响 -->
        <div style="margin-top:20px">
          <div class="sec-title" style="margin-bottom:8px">生效后失效的摘要</div>
          <div style="display:grid;gap:6px">
            ${item.impact.map((u) => `<div style="display:flex;align-items:center;gap:8px;font-size:11px">
              <span style="color:var(--warn)">${CoMem.icon('layers', 12)}</span>
              <span class="mono" style="color:var(--ink-3);word-break:break-all">${u}</span>
            </div>`).join('')}
          </div>
          <p class="hint" style="margin-top:7px">通过后这些目录的 L1 概览会被标记为待刷新，下一次写入或达到阈值时重算。</p>
        </div>
      </div>
    </div>

    <!-- 底部操作 -->
    <div class="review-foot">
      <input class="input" id="rejectReason" placeholder="拒绝原因（拒绝时必填，会写进归档记录）" style="max-width:340px;height:28px;font-size:12px">
      <span class="hint" style="display:flex;gap:5px;align-items:center"><span class="kbd">⌘⏎</span> 通过</span>
      <span class="spacer"></span>
      <button class="btn btn-danger" id="btnReject">拒绝</button>
      <button class="btn btn-primary" id="btnApprove">通过并生效</button>
    </div>`;

  CoMem.bindCopy();
  document.getElementById('btnApprove').addEventListener('click', () => decide(item, 'approve'));
  document.getElementById('btnReject').addEventListener('click', () => {
    const reason = document.getElementById('rejectReason').value.trim();
    if (!reason) {
      document.getElementById('rejectReason').focus();
      CoMem.toast('请先填写拒绝原因');
      return;
    }
    decide(item, 'reject');
  });
}

function decide(item, action) {
  reviewed.add(item.id);
  const next = ITEMS.find((i) => !reviewed.has(i.id));
  if (next) selected = next.id;
  renderList();
  renderDetail();
  CoMem.toast(action === 'approve'
    ? `已通过 · ${item.title} 转为 active`
    : `已拒绝 · 记录原因并删除该条`);
}

/* ==========================================================================
   初始化
   ========================================================================== */

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btnRefresh').innerHTML = CoMem.icon('retry', 14);
  document.getElementById('btnRefresh').addEventListener('click', () => CoMem.toast('已重新拉取待复核队列'));

  renderList();
  renderDetail();

  document.getElementById('list').addEventListener('click', (e) => {
    const row = e.target.closest('[data-id]');
    if (!row) return;
    selected = row.dataset.id;
    renderList();
    renderDetail();
  });

  document.getElementById('typeSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-type]');
    if (!btn) return;
    filterType = btn.dataset.type;
    document.querySelectorAll('#typeSeg button').forEach((b) => b.classList.toggle('is-active', b === btn));
    const items = visibleItems();
    if (items.length && !items.some((i) => i.id === selected)) selected = items[0].id;
    renderList();
    renderDetail();
  });

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      const btn = document.getElementById('btnApprove');
      if (btn) btn.click();
    }
  });
});
</script>
</body>
</html>
