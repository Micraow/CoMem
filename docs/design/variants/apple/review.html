let toastTimer = null;

let filterType = 'all';
const reviewed = new Set();

/* ==========================================================================
   渲染
   ========================================================================== */

function visibleItems() {
  return ITEMS.filter((i) => !reviewed.has(i.id) && (filterType === 'all' || i.type === filterType));
}

function renderList() {
  const items = visibleItems();
  const pending = ITEMS.length - reviewed.size;
  $('#pendCount').textContent = pending;
  $('#pendingTag').innerHTML = `<span class="dot" style="color:var(--orange)"></span>${pending} 条待复核`;
  $('#navReviewCount').textContent = pending;
  $('#footPending').textContent = pending;
  $('#list').innerHTML = items.length ? items.map((i) => `
    <button class="rrow ${i.id === selected ? 'is-selected' : ''}" type="button" data-id="${i.id}">
      <span class="rrow__top">
        <span class="pill ${TYPE_PILL[i.type]}">${TYPE_LABEL[i.type]}</span>
        <span class="rrow__title">${esc(i.title)}</span>
      </span>
      <span class="rrow__meta">
        <span>${esc(i.archive)}</span><span class="rrow__dot">·</span>
        <span>${esc(i.ago)}</span><span class="rrow__dot">·</span>
        <span>${esc(i.merge)}</span>
      </span>
    </button>`).join('') : `
    <div style="padding:34px 16px;text-align:center">
      <div class="sec-label" style="margin-bottom:7px;color:var(--label-2)">队列已清空</div>
      <p class="caption">当前筛选条件下没有待复核记录。</p>
    </div>`;
}

function diffRow(r) {
  if (r.hunk) return `<div class="drow is-hunk"><span>${esc(r.hunk)}</span></div>`;
  const cell = (side, cls) => {
    if (!side) return `<span class="n ${cls}"></span><span class="tx is-empty ${cls}"></span>`;
    return `<span class="n ${cls}">${side.n}</span><span class="tx ${cls}">${esc(side.text) || ' '}</span>`;
  };
  const rowCls = (r.right && r.right.s === 'add') ? 'is-add' : (r.left && r.left.s === 'del') ? 'is-del' : '';
  return `<div class="drow ${rowCls}">${cell(r.left, 'l')}${cell(r.right, 'r')}</div>`;
}

function renderDetail() {
  const pane = $('#reviewPane');
  const remaining = visibleItems();
  const item = remaining.find((i) => i.id === selected) || remaining[0];
  if (!item) {
    pane.innerHTML = `<div style="display:grid;place-items:center;height:100%;padding:48px;text-align:center">
      <div>
        <div class="sec-label" style="margin-bottom:9px;color:var(--green-ink)">全部处理完毕</div>
        <h2 class="title" style="margin-bottom:8px">复核队列已清空</h2>
        <p class="sub" style="max-width:38ch;margin:0 auto">5 条待复核记录已全部分流，管线回到空闲。新的记忆会在下次会话提交后进入队列。</p>
      </div>
    </div>`;
    return;
  }

  const diffHTML = item.rows.map(diffRow).join('');

  pane.innerHTML = `
    <div class="review__scroll">
      <div class="review__inner">

        <div>
          <div class="crumb" style="margin-bottom:12px"><a href="review.html">记忆复核</a><span class="sep">/</span><span class="current">${TYPE_LABEL[item.type]}</span></div>
          <div class="doc-head" style="margin-bottom:12px">
            <div class="doc-head__main">
              <h1 class="doc-title">${esc(item.title)}</h1>
              <div class="uri" data-copy="${esc(item.uri)}" title="点击复制 URI">${esc(item.uri)}</div>
            </div>
            <div class="rowflex" style="flex:none">
              <span class="pill ${TYPE_PILL[item.type]}">${TYPE_LABEL[item.type]}</span>
              <span class="pill pill--orange"><span class="dot"></span>${esc(item.status)}</span>
            </div>
          </div>
          <p class="sub" style="max-width:78ch">${esc(item.summary)}</p>
        </div>

        <dl class="meta-grid">
          <div><dt>来源会话</dt><dd>${esc(item.session)}</dd></div>
          <div><dt>归档</dt><dd>${esc(item.archive)}</dd></div>
          <div><dt>抽取时间</dt><dd>${esc(item.at)}</dd></div>
          <div><dt>合并策略</dt><dd>${esc(item.merge)}</dd></div>
        </dl>

        ${item.fields ? `
        <section>
          <div class="sec-head"><span class="sec-label">规则字段</span><span class="spacer"></span>
            <span class="pill pill--gray">${item.fields.length} 个字段</span>
          </div>
          <dl class="fieldgrid">
            ${item.fields.map((f) => `
              <div>
                <dt>${esc(f.k)}</dt>
                <dd>${f.v}</dd>
              </div>`).join('')}
          </dl>
          <p class="caption mt-12" style="max-width:78ch">
            <span class="mono" style="color:var(--label-2)">applies_when</span> 与
            <span class="mono" style="color:var(--label-2)">exception</span>
            只在 <span class="mono">rule_search</span> 按任务上下文召回时求值，不参与普通全文检索。生效前请确认条件写得足够窄。
          </p>
        </section>` : ''}

        <section>
          <div class="sec-head">
            <span class="sec-label">before / after</span>
            <span class="spacer"></span>
            <span class="mono" style="font-size:13px">
              <span style="color:var(--green-ink)">+${item.added}</span>
              <span style="color:var(--label-4)">/</span>
              <span style="color:var(--red-ink)">−${item.removed}</span>
            </span>
          </div>
          <div class="diff">
            <div class="diff__head">
              <span>${esc(item.title)}</span>
              <span class="spacer"></span>
              <span class="add">+${item.added}</span>
              <span class="del">−${item.removed}</span>
              <span>${esc(item.merge)}</span>
            </div>
            <div class="diff__labels">
              <span></span><span>基线 · 当前内容</span><span></span><span>待生效 · 抽取结果</span>
            </div>
            <div class="dgrid">${diffHTML}</div>
          </div>
        </section>

        <section>
          <div class="sec-head"><span class="sec-label">抽取依据 · 来源对话</span></div>
          <div class="quotes">
            ${item.quotes.map((q) => `
              <div class="quote">
                <span class="quote__role">${esc(q.role)}</span>
                <span class="quote__text">${esc(q.text)}</span>
              </div>`).join('')}
          </div>
        </section>

        <section>
          <div class="sec-head"><span class="sec-label">生效后失效的摘要</span></div>
          <div class="impact">
            ${item.impact.map((u) => `<div class="impact__row">${I.layers}<span>${esc(u)}</span></div>`).join('')}
          </div>
          <p class="caption mt-12" style="max-width:78ch">通过后这些目录的 L1 概览会被标记为待刷新，下一次写入或达到阈值时重算。</p>
        </section>
      </div>
    </div>

    <div class="review__foot">
      <input class="input input--sm" id="rejectReasonInline" placeholder="拒绝原因（拒绝时必填）" aria-label="拒绝原因">
      <span class="caption" style="display:flex;align-items:center;gap:6px"><span class="kbd">⌘</span><span class="kbd">⏎</span> 通过</span>
      <span class="spacer"></span>
      <button class="btn btn--danger" type="button" id="btnReject">拒绝</button>
      <button class="btn btn--primary" type="button" id="btnApprove">${I.check}通过并生效</button>
    </div>`;

  const uriEl = $('.uri', pane);
  if (uriEl) {
    uriEl.addEventListener('click', () => {
      if (navigator.clipboard) navigator.clipboard.writeText(item.uri).catch(() => {});
      toast('已复制 URI');
    });
  }

  $('#btnApprove', pane).addEventListener('click', () => decide(item, 'approve'));
  $('#btnReject', pane).addEventListener('click', () => openSheet(item));
  $('.review__scroll', pane).scrollTop = 0;
}

/* ---- 拒绝 sheet ---- */
let sheetItem = null;

function openSheet(item) {
  sheetItem = item;
  $('#sheetSub').textContent = `拒绝会删除「${item.title}」的待复核记录，原因写进归档记录，供后续追溯。`;
  const inline = $('#rejectReasonInline');
  $('#rejectReason').value = inline ? inline.value : '';
  $('#scrim').classList.add('is-open');
  $('#rejectSheet').classList.add('is-open');
  setTimeout(() => $('#rejectReason').focus(), 120);
}

function closeSheet() {
  $('#scrim').classList.remove('is-open');
  $('#rejectSheet').classList.remove('is-open');
  sheetItem = null;
}

function decide(item, action) {
  reviewed.add(item.id);
  const next = ITEMS.find((i) => !reviewed.has(i.id));
  if (next) selected = next.id;
  renderList();
  renderDetail();
  toast(action === 'approve'
    ? `已通过 · ${item.title} 转为 active`
    : `已拒绝 · 记录原因并删除该条`);
}

/* ==========================================================================
   交互
   ========================================================================== */

document.addEventListener('DOMContentLoaded', () => {
  renderList();
  renderDetail();

  const themeBtn = $('#themeBtn');
  const syncTheme = () => {
    themeBtn.innerHTML = document.documentElement.dataset.theme === 'dark' ? I.sun : I.moon;
  };
  syncTheme();
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('comem-apple-theme', next); } catch (e) {}
    syncTheme();
    toast(next === 'dark' ? '已切换到深色' : '已切换到浅色');
  });

  const scopePop = $('#scopePop');
  const closeScope = () => {
    scopePop.hidden = true;
    $('#scopeBtn').setAttribute('aria-expanded', 'false');
  };
  $('#scopeBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    scopePop.hidden = !scopePop.hidden;
    $('#scopeBtn').setAttribute('aria-expanded', String(!scopePop.hidden));
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.scope-wrap')) closeScope();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeScope();
  });
  $$('#scopePop [data-scope]').forEach((b) => {
    b.addEventListener('click', () => {
      closeScope();
      toast(`已切换到 ${b.dataset.scope}`);
    });
  });
  $('#btnRefresh').addEventListener('click', () => toast('已重新拉取待复核队列'));

  $('#list').addEventListener('click', (e) => {
    const row = e.target.closest('[data-id]');
    if (!row) return;
    selected = row.dataset.id;
    renderList();
    renderDetail();
  });

  $('#typeSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-type]');
    if (!btn) return;
    filterType = btn.dataset.type;
    $$('#typeSeg button').forEach((b) => b.setAttribute('aria-selected', b === btn));
    const items = visibleItems();
    if (items.length && !items.some((i) => i.id === selected)) selected = items[0].id;
    renderList();
    renderDetail();
  });

  $('#scrim').addEventListener('click', closeSheet);
  $('#sheetCancel').addEventListener('click', closeSheet);

  $('#sheetConfirm').addEventListener('click', () => {
    const reason = $('#rejectReason').value.trim();
    if (!reason) {
      $('#rejectReason').focus();
      toast('请先填写拒绝原因');
      return;
    }
    const item = sheetItem;
    closeSheet();
    if (item) decide(item, 'reject');
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeSheet();
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      const btn = $('#btnApprove');
      if (btn) btn.click();
    }
  });
});
</script>
</body>
</html>
