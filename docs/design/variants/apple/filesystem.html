function isMeta(name) {
  return name.startsWith('.') || name === 'memory_diff.json' || name === '.done';
}

function rowHTML(n) {
  const isDir = !!n.children || !!n.dir;
  const meta = isMeta(n.name);
  const caret = isDir ? `<span class="trow__caret">${I.chevron}</span>` : `<span class="trow__caret is-blank">${I.chevron}</span>`;
  const icon = isDir ? I.folder : (meta ? I.meta : I.file);
  const stale = n.stale ? '<span class="dot" style="color:var(--orange)" title="摘要待刷新"></span>' : '';
  const label = isDir ? n.name + '/' : n.name;
  return `<div class="trow${n.sel ? ' is-selected' : ''}${meta ? ' trow--muted' : ''}"
      data-name="${esc(n.name.toLowerCase())}"
      ${n.uri ? `data-uri="${esc(n.uri)}"` : ''}
      ${isDir ? 'data-dir="1"' : ''}
      role="treeitem" tabindex="0" aria-selected="${n.sel ? 'true' : 'false'}" title="${esc(label)}">
    ${caret}
    <span class="trow__icon">${icon}</span>
    <span class="trow__name${isDir ? ' is-dir' : ''}">${esc(label)}</span>
    ${stale}
    <span class="trow__meta">${esc(n.meta || '')}</span>
  </div>`;
}

function treeHTML(nodes) {
  return nodes.map((n) => {
    if (!n.children) return rowHTML(n);
    return `<details ${n.open ? 'open' : ''}>
      <summary>${rowHTML(n)}</summary>
      <div class="tchild">${treeHTML(n.children)}</div>
    </details>`;
  }).join('');
}

  const themeBtn = $('#themeBtn');
  const syncThemeIcon = () => {
    const dark = document.documentElement.dataset.theme === 'dark';
    themeBtn.innerHTML = dark
      ? '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.4M8 13.1v1.4M1.5 8h1.4M13.1 8h1.4M3.4 3.4l1 1M11.6 11.6l1 1M12.6 3.4l-1 1M4.4 11.6l-1 1"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 9.4A5.6 5.6 0 0 1 6.6 3a5.6 5.6 0 1 0 6.4 6.4Z"/></svg>';
  };
  syncThemeIcon();
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    syncThemeIcon();
    toast(next === 'dark' ? '已切换到深色' : '已切换到浅色');
  });

  const scopePop = $('#scopePop');
  const closeScope = () => {
    scopePop.hidden = true;
    $('#scopeBtn').setAttribute('aria-expanded', 'false');
  };
  $('#scopeBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    scopePop.hidden = !scopePop.hidden;
    $('#scopeBtn').setAttribute('aria-expanded', String(!scopePop.hidden));
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.scope-wrap')) closeScope();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeScope();
  });
  $$('#scopePop [data-scope]').forEach((b) => {
    b.addEventListener('click', () => {
      closeScope();
      toast(`已切换到 ${b.dataset.scope}`);
    });
  });
  $('#btnMkdir').addEventListener('click', () => toast('演示稿不提交写操作'));
  $('#btnRefresh').addEventListener('click', () => toast('索引已刷新 · 128 个条目'));

  tree.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const row = e.target.closest('.trow');
    if (!row) return;
    e.preventDefault();
    row.click();
  });

  tree.addEventListener('click', (e) => {
    const row = e.target.closest('.trow');
    if (!row) return;
    /* 接管 summary 的默认折叠，避免「选中即收起」 */
    e.preventDefault();

    const isDir = row.dataset.dir === '1';
    const details = row.closest('details');
    const uri = row.dataset.uri;

    if (e.target.closest('.trow__caret') && isDir) {
      if (details) details.open = !details.open;
      return;
    }

    if (!uri) {
      if (isDir && details) details.open = !details.open;
      else toast('该条目未编入演示数据');
      return;
    }
    if (!DOCS[uri]) {
      $$('.trow', tree).forEach((r) => r.classList.remove('is-selected'));
      row.classList.add('is-selected');
      $('#detailPane').innerHTML = `<div class="content" style="padding:64px 32px">
        <div style="max-width:52ch">
          <span class="pill pill--gray mb-16">未编入演示数据</span>
          <h2 class="title" style="margin:14px 0 10px">${esc(row.querySelector('.trow__name').textContent)}</h2>
          <p class="sub">演示稿只收录 6 个有代表性的节点，其余条目保留在树中，用来展示真实的目录密度与缩进层级。</p>
          <button class="btn btn--primary mt-20" type="button" id="btnBack">回到 code-style.md</button>
        </div>
      </div>`;
      $('#btnBack').addEventListener('click', () => {
        currentUri = 'comem://user/alice/memories/preferences/code-style.md';
        currentLayer = 0;
        $$('.trow', tree).forEach((r) => r.classList.toggle('is-selected', r.dataset.uri === currentUri));
        renderDetail();
      });
      return;
    }

    $$('.trow', tree).forEach((r) => r.classList.remove('is-selected'));
    row.classList.add('is-selected');
    currentUri = uri;
    currentLayer = 0;
    renderDetail();
  });

  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea')) return;
    if (['1', '2', '3'].includes(e.key)) {
      currentLayer = Number(e.key) - 1;
      renderDetail();
    }
  });

  const filter = $('#treeFilter');
  filter.addEventListener('input', () => {
    const q = filter.value.trim().toLowerCase();
    if (!q) {
      tree.innerHTML = treeHTML(TREE);
      return;
    }
    $$('details', tree).forEach((d) => { d.open = true; });
    $$('.trow', tree).forEach((r) => {
      r.style.display = r.dataset.name.includes(q) ? '' : 'none';
    });
  });

  renderDetail();
});
</script>
</body>
</html>
