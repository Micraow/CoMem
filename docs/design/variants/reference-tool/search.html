<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>检索调试台 · CoMem 控制台</title>
<link rel="stylesheet" href="app.css">
<script>
  try {
    var saved = localStorage.getItem('comem-theme');
    if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="CoMem 控制台入口">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-text">CoMem<small>控制台 · 视觉规范 v1.0</small></span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="index.html">规范</a>
      <a href="filesystem.html">文件树</a>
      <a href="search.html" aria-current="page">检索</a>
      <a href="review.html">复核</a>
      <a href="acl.html">权限</a>
    </nav>
    <div class="topbar-right">
      <span class="scope-chip">index&nbsp;<b>fts5 · 128 条</b></span>
      <span class="topbar-divider" aria-hidden="true"></span>
      <button class="btn btn--ghost btn--icon" id="themeToggle" type="button" aria-label="切换深浅色主题">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="app-main">
    <div class="page">
      <div class="page-head">
        <div class="page-head-main">
          <nav class="crumbs" aria-label="位置">
            <a href="index.html">控制台</a><span class="sep">/</span><span>检索调试</span>
          </nav>
          <h1 class="page-title" style="margin-top:10px">检索调试台</h1>
          <p class="page-desc">
            同一条查询分别走 <code>find</code> 与 <code>search</code>。分数来自 FTS5 的 BM25 排序；
            层级表示这条命中的是摘要、概览还是原文。<code>search</code> 会先做意图分析，把原句拆成多条
            TypedQuery，再按类型分别召回。
          </p>
        </div>
        <div class="btn-row">
          <span class="badge badge--ok"><span class="dot"></span>索引就绪</span>
          <button class="btn btn--secondary btn--sm" type="button" id="btnRefreshIndex">刷新索引</button>
        </div>
      </div>

      <!-- ================= 查询条 ================= -->
      <section class="panel">
        <div class="panel-body" style="padding:16px">
          <div class="row" style="flex-wrap:wrap;gap:12px">
            <div class="searchbox" style="flex:1;min-width:280px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
              <input class="input input--mono" id="queryInput" value="TypeScript 严格模式 代码风格" aria-label="检索词">
            </div>
            <div class="seg" id="modeSeg" role="tablist" aria-label="检索模式">
              <button type="button" role="tab" data-mode="find" aria-selected="false">find</button>
              <button type="button" role="tab" data-mode="search" aria-selected="true">search</button>
            </div>
            <button class="btn btn--primary" type="button" id="btnRun">执行检索</button>
          </div>
          <div class="query-options">
            <label class="check"><input type="checkbox" checked> level 不过滤</label>
            <label class="check"><input type="checkbox"> 仅 memory 类型</label>
            <label class="check"><input type="checkbox"> 包含 pending 记录</label>
            <span class="hint" style="margin-left:auto">pending 记录默认不参与召回，勾选后仅用于复核排查</span>
          </div>
        </div>
      </section>

      <!-- ================= 指标 ================= -->
      <div class="metric-strip" id="metrics"></div>

      <!-- ================= 主体 ================= -->
      <div class="search-layout" style="padding-left:0;padding-right:0">
        <div style="display:grid;gap:16px;align-content:start">
          <section class="panel">
            <div class="panel-head">
              <span class="panel-title">召回结果</span>
              <span class="badge badge--neutral" id="resultCount">6</span>
              <span class="spacer"></span>
              <span class="hint mono">按分数降序</span>
            </div>
            <div class="hits" id="results"></div>
          </section>

          <div class="callout callout--info" id="aclNote"></div>
        </div>

        <div style="display:grid;gap:16px;align-content:start">
          <section class="panel">
            <div class="panel-head">
              <span class="panel-title" id="planTitle">查询计划</span>
              <span class="spacer"></span>
              <span class="badge badge--info" id="planBadge">3 条</span>
            </div>
            <div class="plan" id="plan"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <span class="panel-title">耗时拆解</span>
              <span class="spacer"></span>
              <span class="mono hint" id="totalMs">412 ms</span>
            </div>
            <div class="panel-body"><div class="timing" id="timing"></div></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <span class="panel-title">本次调用</span>
              <span class="spacer"></span>
              <button class="btn btn--ghost btn--sm" type="button" id="btnCopyCall">复制</button>
            </div>
            <pre id="callJSON" style="border:0;border-radius:0;background:var(--bg-inset);max-height:260px"></pre>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast-layer" id="toastLayer" aria-live="polite" aria-atomic="false"></div>

<script>
/* ==========================================================================
   演示数据
   ========================================================================== */
var HITS = {
  search: [
    {
      score: 0.87, level: 0,
      uri: "comem://user/alice/memories/preferences/code-style.md",
      abs: "用户在代码风格上的偏好：TypeScript 严格模式、2 空格缩进、偏好函数式写法。",
      terms: [["typescript", 3], ["严格", 1], ["缩进", 1]],
      from: "memory",
      why: "typescript idf 4.21 × tf 3 · 严格 idf 3.08 × tf 1 · 缩进 idf 2.94 × tf 1"
    },
    {
      score: 0.79, level: 1,
      uri: "comem://user/alice/memories/preferences/",
      abs: "preferences/ 共 5 条偏好。code-style 覆盖 TypeScript strict、2 空格缩进与不可变数据写法。",
      terms: [["typescript", 2], ["代码风格", 2], ["偏好", 1]],
      from: "memory",
      why: "代码风格 idf 3.77 × tf 2 · typescript idf 4.21 × tf 2 · 偏好 idf 1.62 × tf 1"
    },
    {
      score: 0.74, level: 2,
      uri: "comem://user/alice/memories/rules/code-review/ts-strict-null.md",
      abs: "规则：不用非空断言绕过 null 检查。applies_when 修改涉及可选字段的代码。",
      terms: [["严格", 2], ["null", 1]],
      from: "memory",
      why: "严格 idf 3.08 × tf 2 · null idf 4.02 × tf 1"
    },
    {
      score: 0.68, level: 0,
      uri: "comem://group/eng/memories/platform-conventions.md",
      abs: "工程组约定：服务统一开启 TypeScript 严格模式，公共类型放在 packages/types 下。",
      terms: [["typescript", 1], ["严格", 1]],
      from: "memory",
      why: "typescript idf 4.21 × tf 1 · 严格 idf 3.08 × tf 1"
    },
    {
      score: 0.61, level: 2,
      uri: "comem://user/alice/resources/comem-demo/tsconfig.json",
      abs: "{\"compilerOptions\":{\"strict\":true,\"noUncheckedIndexedAccess\":true,\"target\":\"ES2022\"}}",
      terms: [["strict", 2], ["tsconfig", 1]],
      from: "resource",
      why: "strict idf 3.96 × tf 2 · tsconfig idf 3.10 × tf 1"
    },
    {
      score: 0.55, level: 0,
      uri: "comem://user/alice/skills/ts-review/SKILL.md",
      abs: "TypeScript review 技能：按严格模式规则检查改动，标出隐式 any 与类型收窄缺失。",
      terms: [["typescript", 1], ["严格", 1]],
      from: "skill",
      why: "typescript idf 4.21 × tf 1 · 严格 idf 3.08 × tf 1"
    }
  ],
  find: [
    {
      score: 0.91, level: 0,
      uri: "comem://user/alice/memories/preferences/code-style.md",
      abs: "用户在代码风格上的偏好：TypeScript 严格模式、2 空格缩进、偏好函数式写法。",
      terms: [["typescript", 3], ["严格", 1], ["代码风格", 2]],
      from: "memory",
      why: "原句整体匹配 · typescript idf 4.21 × tf 3 · 代码风格 idf 3.77 × tf 2"
    },
    {
      score: 0.72, level: 1,
      uri: "comem://user/alice/memories/preferences/",
      abs: "preferences/ 共 5 条偏好。code-style 覆盖 TypeScript strict 与 2 空格缩进。",
      terms: [["typescript", 2], ["代码风格", 1]],
      from: "memory",
      why: "代码风格 idf 3.77 × tf 1 · typescript idf 4.21 × tf 2"
    },
    {
      score: 0.44, level: 2,
      uri: "comem://user/alice/memories/rules/code-review/ts-strict-null.md",
      abs: "规则：不用非空断言绕过 null 检查。applies_when 修改涉及可选字段的代码。",
      terms: [["严格", 1]],
      from: "memory",
      why: "严格 idf 3.08 × tf 1"
    }
  ]
};

var PLAN = [
  { kind: "memory", q: "代码风格偏好 TypeScript 严格模式 缩进", hits: 4 },
  { kind: "resource", q: "tsconfig strict 配置 项目", hits: 1 },
  { kind: "skill", q: "typescript 规范检查 技能", hits: 1 }
];

var TIMING = {
  search: [
    ["意图分析（LLM）", 380, "info"],
    ["逐条召回（3 条 query）", 24, "ok"],
    ["去重与合并", 0, "ok"],
    ["ACL 过滤", 0, "ok"],
    ["BM25 重排", 8, "ok"]
  ],
  find: [
    ["召回（单条 query）", 6, "ok"],
    ["ACL 过滤", 0, "ok"],
    ["BM25 重排", 3, "ok"]
  ]
};

var CALL = {
  search: '{\n  "tool": "search",\n  "query": "TypeScript 严格模式 代码风格",\n  "targetUri": "comem://user/alice/",\n  "limit": 10,\n  "sessionId": "session_7c1a"\n}',
  find: '{\n  "tool": "find",\n  "query": "TypeScript 严格模式 代码风格",\n  "targetUri": "comem://user/alice/",\n  "limit": 10\n}'
};

var LEVEL_LABEL = ["摘要", "概览", "原文"];
var mode = "search";

/* ==========================================================================
   渲染
   ========================================================================== */
function strataHTML(level) {
  return '<span class="strata" data-level="' + level + '"><i></i><i></i><i></i></span>';
}

function renderMetrics() {
  var hits = HITS[mode];
  var l0 = hits.filter(function (h) { return h.level === 0; }).length;
  var l1 = hits.filter(function (h) { return h.level === 1; }).length;
  var l2 = hits.filter(function (h) { return h.level === 2; }).length;
  var total = TIMING[mode].reduce(function (sum, t) { return sum + t[1]; }, 0);

  document.getElementById("metrics").innerHTML =
    '<div class="metric"><div class="metric-value">' + hits.length + "</div><div class='metric-label'>返回条目</div></div>" +
    '<div class="metric"><div class="metric-value">' + (mode === "search" ? 13 : 4) + "</div><div class='metric-label'>候选总数</div></div>" +
    '<div class="metric"><div class="metric-value" style="color:var(--danger)">2</div><div class="metric-label">ACL 过滤</div></div>' +
    '<div class="metric"><div class="metric-value">' + total + "<small>ms</small></div><div class='metric-label'>总耗时 · " + (mode === "search" ? "含意图分析" : "单条查询") + "</div></div>";
}

function highlightURI(uri) {
  return uri.replace(/TypeScript|typescript/gi, function (m) { return "<mark>" + m + "</mark>"; });
}

function renderResults() {
  var wrap = document.getElementById("results");
  document.getElementById("resultCount").textContent = HITS[mode].length;

  wrap.innerHTML = HITS[mode].map(function (h) {
    return (
      '<article class="hit">' +
        '<div class="hit-score">' +
          '<span class="v' + (h.score < 0.6 ? " low" : "") + '">' + h.score.toFixed(2) + "</span>" +
          '<span class="bar' + (h.score < 0.6 ? "" : "") + '"><i style="width:' + Math.round(h.score * 100) + '%"></i></span>' +
          '<span class="layers" style="font-size:13px">' + strataHTML(h.level) + "L" + h.level + "</span>" +
        "</div>" +
        '<div class="hit-body">' +
          '<div class="hit-uri">' + highlightURI(h.uri) + "</div>" +
          '<div class="hit-abs">' + h.abs + "</div>" +
          '<div class="hit-reasons">' +
            '<span class="wk">命中</span>' +
            h.terms.map(function (t) { return '<span class="term">' + t[0] + "<b>×" + t[1] + "</b></span>"; }).join("") +
            '<details style="margin-left:2px">' +
              '<summary style="cursor:pointer;list-style:none;font-family:var(--font-mono);font-size:13px;color:var(--text-3)">评分明细 ▾</summary>' +
              '<div class="mono" style="font-size:13px;color:var(--text-3);margin-top:6px;line-height:1.7">' + h.why + "</div>" +
            "</details>" +
          "</div>" +
        "</div>" +
        '<div class="hit-side">' +
          '<span class="badge badge--neutral">' + LEVEL_LABEL[h.level] + "</span>" +
          '<span class="from">' + h.from + "</span>" +
        "</div>" +
      "</article>"
    );
  }).join("");
}

function renderPlan() {
  var isSearch = mode === "search";
  document.getElementById("planTitle").textContent = isSearch ? "查询计划 · TypedQuery" : "单条查询";
  document.getElementById("planBadge").textContent = isSearch ? PLAN.length + " 条" : "1 条";
  document.getElementById("planBadge").className = "badge " + (isSearch ? "badge--info" : "badge--neutral");

  var planEl = document.getElementById("plan");
  if (isSearch) {
    planEl.innerHTML = PLAN.map(function (p, i) {
      return (
        '<div class="plan-item">' +
          '<span class="plan-n">' + String(i + 1).padStart(2, "0") + "</span>" +
          "<div>" +
            '<div class="plan-kind">' + p.kind + "</div>" +
            '<div class="plan-q">' + p.q + "</div>" +
          "</div>" +
          '<span class="plan-r">' + p.hits + " 条</span>" +
        "</div>"
      );
    }).join("") +
    '<div class="plan-summary">' +
      "<div><span>候选总数</span><b>13</b></div>" +
      "<div><span>跨 query 去重后</span><b>8</b></div>" +
      '<div class="is-filter"><span>ACL 过滤</span><b>−2</b></div>' +
      '<div class="is-total"><span>返回</span><b>6</b></div>' +
    "</div>";
  } else {
    planEl.innerHTML =
      '<div class="plan-item">' +
        '<span class="plan-n">01</span>' +
        "<div>" +
          '<div class="plan-kind" style="color:var(--text-3)">raw query</div>' +
          '<div class="plan-q">TypeScript 严格模式 代码风格</div>' +
        "</div>" +
        '<span class="plan-r">3 条</span>' +
      "</div>" +
      '<div class="plan-note" style="padding:11px 16px;border-top:1px solid var(--border);background:var(--surface-2);font-size:13px;line-height:1.6;color:var(--text-3)">' +
        "<b style=\"color:var(--text-2)\">find</b> 不做意图分析，把原句直接送进 FTS5。延迟低，但只覆盖字面表达：" +
        "「代码风格」没有拆成 resource / skill 两个方向，所以这两类目录下的条目不会进入候选。" +
      "</div>";
  }
}

function renderTiming() {
  var total = TIMING[mode].reduce(function (sum, t) { return sum + t[1]; }, 0);
  document.getElementById("totalMs").textContent = total + " ms";
  document.getElementById("timing").innerHTML = TIMING[mode].map(function (row) {
    return (
      "<div>" +
        '<div class="timing-top"><span>' + row[0] + '</span><span class="ms">' + row[1] + " ms</span></div>" +
        '<span class="bar bar--' + row[2] + '"><i style="width:' + Math.max(3, (row[1] / Math.max(total, 1)) * 100) + '%"></i></span>' +
      "</div>"
    );
  }).join("");
}

function renderACL() {
  document.getElementById("aclNote").innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M12 3 4 6v6c0 4.4 3.4 7.7 8 9 4.6-1.3 8-4.6 8-9V6Z"/><path d="m9 12 2 2 4-4"/></svg>' +
    "<div>" +
      "<b>ACL 过滤 2 条</b>，按当前身份 <span class='mono'>user:alice</span> 求值。" +
      "被过滤的条目不会出现在结果里，也不返回占位——列表语义是无权限即不可见。" +
      '<div class="chips" style="margin-top:8px">' +
        '<span class="tag">个人空间 · 无 read 权限 <b>1</b></span>' +
        '<span class="tag">组空间 · restricted 未授权 <b>1</b></span>' +
      "</div>" +
    "</div>";
}

function renderCall() {
  document.getElementById("callJSON").textContent = CALL[mode];
}

function renderAll() {
  document.querySelectorAll("#modeSeg button").forEach(function (b) {
    b.setAttribute("aria-selected", String(b.getAttribute("data-mode") === mode));
  });
  renderMetrics();
  renderResults();
  renderPlan();
  renderTiming();
  renderACL();
  renderCall();
}

/* ==========================================================================
   交互
   ========================================================================== */
function toast(message) {
  var layer = document.getElementById("toastLayer");
  var node = document.createElement("div");
  node.className = "toast";
  node.innerHTML = '<span class="dot"></span><span></span>';
  node.lastChild.textContent = message;
  layer.appendChild(node);
  setTimeout(function () {
    node.classList.add("is-leaving");
    setTimeout(function () { node.remove(); }, 200);
  }, 2200);
}

document.addEventListener("DOMContentLoaded", function () {
  var root = document.documentElement;
  var toggle = document.getElementById("themeToggle");
  function syncLabel() {
    toggle.setAttribute("aria-label", root.getAttribute("data-theme") === "light" ? "切换到深色主题" : "切换到浅色主题");
  }
  toggle.addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("comem-theme", next); } catch (e) {}
    syncLabel();
  });
  syncLabel();

  renderAll();

  document.getElementById("modeSeg").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-mode]");
    if (!btn) return;
    mode = btn.getAttribute("data-mode");
    renderAll();
  });

  document.getElementById("btnRun").addEventListener("click", function () {
    var btn = document.getElementById("btnRun");
    var original = btn.textContent;
    btn.disabled = true;
    btn.textContent = mode === "search" ? "分析意图…" : "检索中…";
    setTimeout(function () {
      btn.disabled = false;
      btn.textContent = original;
      renderAll();
      toast(mode === "search" ? "已拆解为 3 条 TypedQuery，返回 6 条" : "find 返回 3 条，耗时 9 ms");
    }, 460);
  });

  document.getElementById("btnCopyCall").addEventListener("click", function () {
    if (navigator.clipboard) navigator.clipboard.writeText(CALL[mode]).catch(function () {});
    toast("已复制调用参数");
  });

  document.getElementById("btnRefreshIndex").addEventListener("click", function () {
    toast("索引已刷新 · fts5 · 128 条");
  });
});
</script>
</body>
</html>
