function visibleItems() {
  return ITEMS.filter(function (i) {
    return !reviewed[i.id] && (filterType === "all" || i.type === filterType);
  });
}

function renderList() {
  var items = visibleItems();
  document.getElementById("pendCount").textContent = ITEMS.length - Object.keys(reviewed).length;

  document.getElementById("list").innerHTML = items.length
    ? items.map(function (i) {
        return (
          '<button class="review-item" type="button" data-id="' + i.id + '" aria-selected="' + (i.id === selected) + '">' +
            '<span class="review-item-top">' +
              '<span class="badge ' + (i.type === "rule" ? "badge--info" : "badge--accent") + '">' + TYPE_LABEL[i.type] + "</span>" +
              '<span class="review-item-title">' + i.title + "</span>" +
            "</span>" +
            '<span class="review-item-meta">' +
              "<span>" + i.archive + '</span><span class="d">·</span>' +
              "<span>" + i.ago + '</span><span class="d">·</span>' +
              "<span>" + i.merge + "</span>" +
            "</span>" +
          "</button>"
        );
      }).join("")
    : '<div class="empty"><strong>队列已清空</strong><span>当前筛选条件下没有待复核记录。</span></div>';
}

    alert: '<path d="M10.3 3.9 2.5 17.4A1.9 1.9 0 0 0 4.2 20h15.6a1.9 1.9 0 0 0 1.7-2.6L13.7 3.9a1.9 1.9 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',
    layers: '<path d="m12 3 9 5-9 5-9-5Z"/><path d="m3 13 9 5 9-5"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'
  };
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths[name] + "</svg>";
}

  var item = ITEMS.filter(function (i) { return i.id === selected; })[0];
  var pane = document.getElementById("reviewPane");

  if (!item || reviewed[item.id]) {
    var next = visibleItems()[0];
    if (next) { selected = next.id; item = next; }
  }

  if (!item) {
    pane.innerHTML =
      '<div class="empty" style="height:100%">' +
        "<strong>全部处理完毕</strong>" +
        "<span>5 条待复核记录已全部分流，管线回到空闲。新的记忆会在下次会话提交后进入队列。</span>" +
        '<a class="btn btn--secondary btn--sm" href="filesystem.html" style="margin-top:8px">回到文件树</a>' +
      "</div>";
    return;
  }

  var added = item.diff.filter(function (l) { return l.t === "add"; }).length;
  var removed = item.diff.filter(function (l) { return l.t === "del"; }).length;

  var diffRows = item.diff.map(function (l) {
    if (l.t === "hunk") {
      return '<div class="diff-hunk">' + l.text + "</div>";
    }
    var sign = l.t === "add" ? "+" : l.t === "del" ? "−" : " ";
    return (
      '<div class="diff-row ' + l.t + '">' +
        '<span class="ln">' + (l.n == null ? "" : l.n) + "</span>" +
        '<span class="sig">' + sign + "</span>" +
        '<span class="tx">' + escapeHTML(l.text) + "</span>" +
      "</div>"
    );
  }).join("");

  pane.innerHTML =
    '<div class="review-scroll">' +
      '<nav class="crumbs" aria-label="位置">' +
        '<a href="review.html">记忆复核</a><span class="sep">/</span><span>' + TYPE_LABEL[item.type] + "</span>" +

          '<div class="uri-line"><span class="uri">' + item.uri + "</span></div>" +
        "</div>" +
        '<div class="btn-row">' +
          '<span class="badge ' + (item.type === "rule" ? "badge--info" : "badge--accent") + '">' + TYPE_LABEL[item.type] + "</span>" +

        "</div>" +

        "<div><div class='k'>来源会话</div><div class='v'>" + item.session + "</div></div>" +

        "<div><div class='k'>合并策略</div><div class='v'>" + item.merge + "</div></div>" +
      "</div>" +

      '<section style="margin-top:24px">' +
        '<div class="section-title">后台任务 <span class="hint">归档 → 抽取 → 合并 → 摘要失效</span></div>' +
        '<div class="panel">' +
          '<div class="panel-body" style="padding:14px 16px">' +
            '<div class="pipeline">' +
              '<span class="pipeline-step is-done"><span class="dot"></span>archive</span>' +
              '<span class="pipeline-arrow">→</span>' +
              '<span class="pipeline-step is-done"><span class="dot"></span>extract</span>' +
              '<span class="pipeline-arrow">→</span>' +
              '<span class="pipeline-step is-running"><span class="dot"></span>merge</span>' +

      '<section style="margin-top:24px">' +
        '<div class="section-title">before / after' +
          '<span class="badge badge--neutral" style="margin-left:auto"><span style="color:var(--ok)">+' + added + '</span><span style="color:var(--border-strong)">/</span><span style="color:var(--danger)">−' + removed + "</span></span>" +
        "</div>" +
        '<div class="diff">' +
          '<div class="diff-head">' +
            "<span>" + item.title + "</span>" +
            '<span class="spacer"></span>' +
            '<span class="plus">+' + added + "</span>" +
            '<span class="minus">−' + removed + "</span>" +
            "<span>patch</span>" +
          "</div>" +
          diffRows +
        "</div>" +
      "</section>" +

      '<section style="margin-top:24px">' +
        '<div class="section-title">抽取依据 · 来源对话</div>' +
        '<div class="quotes">' +
          item.quotes.map(function (q) {
            return '<div class="quote"><span class="role">' + q.role + '</span><span class="text">' + q.text + "</span></div>";
          }).join("") +
        "</div>" +
      "</section>" +

      '<section style="margin-top:24px">' +
        '<div class="section-title">生效后待刷新的摘要</div>' +
        '<div class="impact">' +
          item.impact.map(function (u) {
            return '<div class="impact-row">' + icon("layers") + "<span>" + u + "</span></div>";
          }).join("") +
        "</div>" +
        '<p class="hint" style="margin-top:9px">通过后这些目录的 L1 概览会被标记为待刷新，下一次写入或达到阈值时重算。</p>' +
      "</section>" +

      '<div class="callout callout--info" style="margin-top:24px">' + icon("info") +
        "<span>复核只改变这条记忆是否生效，不修改原文。拒绝时填写的理由会写进归档记录，供下一次抽取参考。</span>" +
      "</div>" +
    "</div>" +

    '<div class="review-foot">' +
      '<input class="input" id="rejectReason" type="text" placeholder="拒绝原因（拒绝时必填，会写进归档记录）" aria-label="拒绝原因">' +
      '<span class="hint" style="display:flex;align-items:center;gap:5px"><span class="kbd">⌘⏎</span> 通过</span>' +
      '<span class="spacer"></span>' +
      '<button class="btn btn--danger-ghost" type="button" id="btnReject">拒绝</button>' +
      '<button class="btn btn--primary" type="button" id="btnApprove">' + icon("check") + "通过并生效</button>" +
    "</div>";

  document.getElementById("btnApprove").addEventListener("click", function () { decide(item, "approve"); });
  document.getElementById("btnReject").addEventListener("click", function () {
    var reason = document.getElementById("rejectReason").value.trim();
    if (!reason) {
      document.getElementById("rejectReason").focus();
      toast("请先填写拒绝原因");
      return;
    }
    decide(item, "reject");
  });
}

function escapeHTML(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function decide(item, action) {
  reviewed[item.id] = true;
  var next = ITEMS.filter(function (i) { return !reviewed[i.id]; })[0];
  selected = next ? next.id : null;
  renderList();
  renderDetail();
  toast(action === "approve" ? "已通过 · " + item.title + " 转为 active" : "已拒绝 · 记录原因并删除该条");
}

function toast(message) {
  var layer = document.getElementById("toastLayer");
  var node = document.createElement("div");
  node.className = "toast";
  node.innerHTML = '<span class="dot"></span><span></span>';
  node.lastChild.textContent = message;
  layer.appendChild(node);
  setTimeout(function () {
    node.classList.add("is-leaving");
    setTimeout(function () { node.remove(); }, 200);
  }, 2200);
}

/* ==========================================================================
   交互
   ========================================================================== */
document.addEventListener("DOMContentLoaded", function () {
  var root = document.documentElement;
  var toggle = document.getElementById("themeToggle");
  function syncLabel() {
    toggle.setAttribute("aria-label", root.getAttribute("data-theme") === "light" ? "切换到深色主题" : "切换到浅色主题");
  }
  toggle.addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("comem-theme", next); } catch (e) {}
    syncLabel();
  });
  syncLabel();

  renderList();
  renderDetail();

  document.getElementById("list").addEventListener("click", function (e) {
    var row = e.target.closest("[data-id]");
    if (!row) return;
    selected = row.getAttribute("data-id");
    renderList();
    renderDetail();
  });

  document.getElementById("typeSeg").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-type]");
    if (!btn) return;
    filterType = btn.getAttribute("data-type");
    document.querySelectorAll("#typeSeg button").forEach(function (b) {
      b.setAttribute("aria-selected", String(b === btn));
    });
    var items = visibleItems();
    if (items.length && !items.some(function (i) { return i.id === selected; })) selected = items[0].id;
    renderList();
    renderDetail();
  });

  document.getElementById("btnRefresh").addEventListener("click", function () {
    toast("已重新拉取待复核队列 · 5 条");
  });

  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      var btn = document.getElementById("btnApprove");
      if (btn) btn.click();
    }
  });
});
</script>
</body>
</html>
