<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆复核 · CoMem 控制台</title>
<link rel="stylesheet" href="app.css">
<script>document.documentElement.dataset.theme = (function () { try { return localStorage.getItem('comem-md3-theme') || 'dark'; } catch (e) { return 'dark'; } })();</script>
<style>
  .main { height: calc(100vh - 64px); overflow: hidden; }
  .split { height: 100%; grid-template-columns: 360px minmax(0, 1fr); }

  .queue-toolbar {
    padding: 12px 14px;
    border-bottom: 1px solid var(--outline-variant);
    display: grid;
    gap: 10px;
  }

  .queue-stat {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 13px;
    color: var(--on-surface-variant);
  }

  .queue-stat b {
    font-size: 22px;
    font-weight: 400;
    color: var(--on-surface);
    font-family: var(--font-mono);
    line-height: 1;
  }

  .q-item {
    position: relative;
    display: block;
    width: 100%;
    padding: 16px 18px 16px 20px;
    border-bottom: 1px solid var(--outline-variant);
    text-align: left;
    color: var(--on-surface);
    transition: background var(--dur-short) var(--ease-standard);
  }

  .q-item:hover { background: var(--surface-container); }

  .q-item[aria-selected="true"] {
    background: var(--secondary-container);
    color: var(--on-secondary-container);
  }

  .q-item[aria-selected="true"]::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--on-secondary-container);
  }

  .q-item[aria-selected="true"] .q-meta,
  .q-item[aria-selected="true"] .q-title {
    color: var(--on-secondary-container);
  }

  .q-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .q-title {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.01em;
    margin-top: 8px;
    font-family: var(--font-mono);
    overflow-wrap: anywhere;
    line-height: 1.45;
  }

  .q-meta {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
    font-size: 13px;
    color: var(--on-surface-variant);
    flex-wrap: wrap;
  }

  .q-meta .sep { color: var(--outline); }

  /* ---------- 详情 ---------- */
  .review-scroll { padding: 24px 28px 140px; }

  .rv-title-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .rv-title-row h1 {
    font-size: 28px;
    line-height: 1.29;
    font-weight: 400;
    font-family: var(--font-mono);
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }

  .rv-summary {
    margin-top: 14px;
    max-width: 82ch;
    font-size: 15px;
    line-height: 1.65;
    color: var(--on-surface-variant);
  }

  .meta-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    gap: 1px;
    background: var(--outline-variant);
    border: 1px solid var(--outline-variant);
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-top: 20px;
  }

  .meta-strip > div { background: var(--surface-container-low); padding: 14px 16px; }

  .meta-strip .k {
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--on-surface-variant);
  }

  .meta-strip .v {
    margin-top: 5px;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--on-surface);
    overflow-wrap: anywhere;
  }

  /* 规则字段 */
  .rule-fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
  }

  .rf {
    padding: 16px 18px;
    border-radius: var(--radius-md);
    background: var(--surface-container-low);
    border: 1px solid var(--outline-variant);
  }

  .rf.applies_when,
  .rf.exception {
    background: color-mix(in srgb, var(--tertiary-container) 20%, var(--surface-container-low));
    border-color: color-mix(in srgb, var(--tertiary) 38%, transparent);
  }

  .rf.applies_when .rf-k,
  .rf.exception .rf-k { color: var(--tertiary); }

  .rf-k {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--on-surface-variant);
    letter-spacing: 0.02em;
  }

  .rf-v {
    margin-top: 8px;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--on-surface);
  }

  .rf-v code {
    font-size: 13.5px;
    padding: 2px 6px;
    border-radius: var(--radius-xs);
    background: var(--surface-container-high);
  }

  /* diff */
  .diff {
    border-radius: var(--radius-sm);
    overflow: hidden;
    border: 1px solid var(--outline-variant);
    font-family: var(--font-mono);
    font-size: 13.5px;
    line-height: 1.8;
  }

  .dl {
    display: grid;
    grid-template-columns: 52px 22px minmax(0, 1fr);
    gap: 0;
    padding-right: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .dl .ln {
    text-align: right;
    padding-right: 12px;
    color: var(--outline);
    user-select: none;
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
    line-height: 1.95;
  }

  .dl .sig {
    text-align: center;
    user-select: none;
    font-weight: 500;
    line-height: 1.95;
  }

  .dl .tx { padding: 0 0 0 4px; }

  .dl.hunk {
    background: var(--surface-container);
    color: var(--on-surface-variant);
    font-size: 13px;
  }

  .dl.hunk .sig { color: var(--primary); letter-spacing: 0.08em; }

  .dl.ctx { color: var(--on-surface-variant); }

  .dl.add {
    background: color-mix(in srgb, var(--primary) 12%, transparent);
    color: var(--on-surface);
  }

  .dl.add .sig { color: var(--primary); }

  .dl.del {
    background: color-mix(in srgb, var(--error) 12%, transparent);
    color: var(--on-surface-variant);
    text-decoration: line-through;
    text-decoration-color: color-mix(in srgb, var(--error) 55%, transparent);
  }

  .dl.del .sig { color: var(--error); }

  .diff-foot {
    display: flex;
    gap: 16px;
    padding: 10px 16px;
    background: var(--surface-container);
    border-top: 1px solid var(--outline-variant);
    font-size: 13px;
    color: var(--on-surface-variant);
  }

  .diff-foot .add-n { color: var(--primary); font-family: var(--font-mono); }
  .diff-foot .del-n { color: var(--error); font-family: var(--font-mono); }

  /* 引用 */
  .quotes { display: grid; gap: 12px; }

  .quote {
    display: grid;
    grid-template-columns: 76px minmax(0, 1fr);
    gap: 14px;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    background: var(--surface-container-low);
    border: 1px solid var(--outline-variant);
    font-size: 14.5px;
    line-height: 1.6;
  }

  .quote.user { border-left: 3px solid var(--secondary); }
  .quote.assistant { border-left: 3px solid var(--primary); }

  .quote .role {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.03em;
    color: var(--on-surface-variant);
    padding-top: 1px;
  }

  .quote.user .role { color: var(--secondary); }
  .quote.assistant .role { color: var(--primary); }

  .impact {
    display: grid;
    gap: 8px;
    margin-top: 4px;
  }

  .impact div {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 13.5px;
    color: var(--on-surface-variant);
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    background: var(--surface-container-lowest);
    border: 1px solid var(--outline-variant);
  }

  .impact svg { color: var(--tertiary); }

  /* 底部操作条 */
  .action-bar {
    position: sticky;
    bottom: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 16px 28px;
    background: var(--surface-container);
    border-top: 1px solid var(--outline-variant);
    box-shadow: 0 -4px 12px rgb(0 0 0 / 0.16);
  }

  .action-bar .hint {
    font-size: 13px;
    color: var(--on-surface-variant);
  }

  .action-bar kbd {
    display: inline-block;
    padding: 2px 6px;
    border-radius: var(--radius-xs);
    border: 1px solid var(--outline-variant);
    background: var(--surface-container-lowest);
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--on-surface-variant);
  }

  .empty-state {
    display: grid;
    place-items: center;
    height: 100%;
    padding: 48px 32px;
    text-align: center;
  }

  .empty-state .es-ico {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--secondary-container);
    color: var(--on-secondary-container);
    margin: 0 auto 20px;
  }

  @media (max-width: 1100px) {
    .split { grid-template-columns: 300px minmax(0, 1fr); }
    .review-scroll { padding: 20px 20px 140px; }
  }

  @media (max-width: 900px) {
    .split { grid-template-columns: minmax(0, 1fr); }
  }

  @media (max-width: 900px) {
    .main { height: auto; overflow: visible; }
    .split { height: auto; }
    .pane-scroll { overflow: visible; }
    .action-bar { position: static; }
    .review-scroll { padding-bottom: 40px; }
  }
</style>
</head>

          <div class="chip-row" id="typeFilter">
            <button class="chip is-on" type="button" data-filter="all" aria-pressed="true">全部 <span class="chip-n">5</span></button>

            <button class="chip" type="button" data-filter="rule" aria-pressed="false">规则 <span class="chip-n">2</span></button>
          </div>
        </div>

        <div class="pane-scroll" id="list" role="listbox" aria-label="待复核记录"></div>

        <div class="pane-foot" style="font-size:13px;line-height:1.55;color:var(--on-surface-variant)">
          复核通过前，这些记录不进入检索结果。
        </div>
      </section>

      <!-- ================= 详情 ================= -->
      <section class="pane" id="reviewPane" aria-live="polite"></section>

    </div>
  </main>
</div>

    ],
    quotes: [
      { role: 'user', text: '这个用例挂了一次，重跑过了，应该没事。' },
      { role: 'assistant', text: '连续两次失败一次通过，说明有共享状态。先隔离，再修。' }
    ],
    impact: ['comem://user/alice/memories/experiences/']
  }
];

const TYPE_LABEL = { experience: '经验', rule: '规则' };

let selected = ITEMS[0].id;
let filterType = 'all';
const reviewed = new Map();

/* ==========================================================================
   渲染
   ========================================================================== */

function visibleItems() {
  return ITEMS.filter((i) => !reviewed.has(i.id) && (filterType === 'all' || i.type === filterType));
}

function renderList() {
  const items = visibleItems();
  const left = ITEMS.length - reviewed.size;
  document.getElementById('pendCount').textContent = left;
  document.getElementById('pendBadge').textContent = `${left} 条`;
  const nav = document.querySelector('.nav-item[href="review.html"] .nav-count');
  if (nav) nav.textContent = left;

  document.getElementById('list').innerHTML = items.length
    ? items.map((i) => `
      <button class="q-item" type="button" role="option" data-id="${i.id}" aria-selected="${i.id === selected}">
        <div class="q-top">
          <span class="badge ${i.type === 'rule' ? 'badge-tertiary' : 'badge-secondary'}">${TYPE_LABEL[i.type]}</span>
          <span class="badge badge-outline">${i.merge}</span>
        </div>
        <div class="q-title">${i.title}</div>
        <div class="q-meta">
          <span>${i.archive}</span><span class="sep">·</span>
          <span>${i.ago}</span>
        </div>
      </button>`).join('')
    : `<div class="empty" style="padding:48px 24px;text-align:center;color:var(--on-surface-variant);font-size:14px;line-height:1.6">
        <div class="label" style="font-size:15px;font-weight:500;color:var(--on-surface);margin-bottom:6px">队列已清空</div>
        当前筛选条件下没有待复核记录。
      </div>`;
}

function renderDetail() {
  const pane = document.getElementById('reviewPane');
  const item = ITEMS.find((i) => i.id === selected) || visibleItems()[0];

  if (!item) {
    pane.innerHTML = `<div class="empty-state"><div>
      <div class="es-ico">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5L20 7"/></svg>
      </div>
      <h2 class="t-title-l" style="color:var(--on-surface);margin-bottom:10px">全部处理完毕</h2>
      <p class="muted-sm" style="max-width:42ch;margin:0 auto">
        5 条待复核记录已全部分流，管线回到空闲。新的记忆会在下次会话提交后进入队列。
      </p>
    </div></div>`;
    return;
  }

  selected = item.id;

  const added = item.diff.filter((l) => l.t === 'add').length;
  const removed = item.diff.filter((l) => l.t === 'del').length;

  const diffHTML = item.diff.map((l) => {
    if (l.t === 'hunk') {
      return `<div class="dl hunk"><span class="ln"></span><span class="sig">@@</span><span class="tx">${l.text.replace('@@ ', '').replace(' @@', '')}</span></div>`;
    }
    return `<div class="dl ${l.t}">
      <span class="ln">${l.n ?? ''}</span>
      <span class="sig">${l.t === 'add' ? '+' : l.t === 'del' ? '−' : ' '}</span>
      <span class="tx">${M3.esc(l.text)}</span>
    </div>`;
  }).join('');

  const fieldsHTML = item.fields
    ? `<section class="card card-filled" style="margin-top:20px">
        <div class="card-head">
          <span class="card-title">规则字段</span>
          <span class="spacer"></span>
          <span class="badge badge-tertiary">applies_when 决定召回条件</span>
        </div>
        <div class="card-body">
          <div class="rule-fields">
            ${item.fields.map((f) => `
              <div class="rf ${f.k}">
                <div class="rf-k">
                  ${f.k}
                </div>
                <div class="rf-v">${f.v}</div>
              </div>`).join('')}
          </div>
          <p class="muted-sm" style="margin-top:14px;font-size:13px">
            <code>applies_when</code> 是规则被召回的条件，<code>exception</code> 是豁免范围。两者共同决定这条规则在什么情况下生效。
          </p>
        </div>
      </section>`
    : '';

  pane.innerHTML = `
  <div class="pane-scroll">
    <div class="review-scroll">

      <div class="crumb">
        <a href="index.html">控制台</a><span class="sep">/</span>
        <a href="review.html">记忆复核</a><span class="sep">/</span>
        <span class="here">${TYPE_LABEL[item.type]}</span>
      </div>

      <div class="rv-title-row">
        <div style="min-width:0;flex:1">
          <h1>${item.title}</h1>
          <div class="uri mt-8" data-copy="${item.uri}">${item.uri}</div>
        </div>
        <div class="row gap-8 row-wrap">
          <span class="badge ${item.type === 'rule' ? 'badge-tertiary' : 'badge-secondary'}">${TYPE_LABEL[item.type]}</span>
          <span class="badge badge-tertiary badge-dot">pending</span>
          <span class="badge badge-outline">${item.merge}</span>
        </div>
      </div>

      <p class="rv-summary">${item.summary}</p>

      <div class="meta-strip">
        <div><div class="k">来源会话</div><div class="v">${item.session}</div></div>
        <div><div class="k">归档</div><div class="v">${item.archive}</div></div>
        <div><div class="k">提交时间</div><div class="v">${item.at}</div></div>
        <div><div class="k">合并方式</div><div class="v">${item.merge}</div></div>
        <div><div class="k">状态流转</div><div class="v">pending → active</div></div>
      </div>

      ${fieldsHTML}

      <section class="card card-elevated" style="margin-top:20px" aria-label="变更差异">
        <div class="card-head">
          <span class="card-title">变更差异</span>
          <span class="spacer"></span>
          <span class="badge badge-outline">before / after</span>
        </div>
        <div style="padding:0">
          <div class="diff">${diffHTML}</div>
          <div class="diff-foot">
            <span class="add-n">+${added} 新增</span>
            <span class="del-n">−${removed} 删除</span>
            <span class="spacer"></span>
            <span>统一 diff · 上下文 3 行</span>
          </div>
        </div>
      </section>

      <section class="card" style="margin-top:20px" aria-label="来源原文">
        <div class="card-head">
          <span class="card-title">来源原文</span>
          <span class="spacer"></span>
          <a class="btn btn-text btn-sm" href="filesystem.html">${item.session}</a>
        </div>
        <div class="card-body">
          <div class="quotes">
            ${item.quotes.map((q) => `
              <div class="quote ${q.role}">
                <span class="role">${q.role === 'user' ? '用户' : 'agent'}</span>
                <span>${q.text}</span>
              </div>`).join('')}
          </div>
        </div>
      </section>

      <section class="card" style="margin-top:20px" aria-label="影响范围">
        <div class="card-head">
          <span class="card-title">影响范围</span>
          <span class="spacer"></span>
          <span class="mono-sm" style="font-size:13px">生效后需重算摘要</span>
        </div>
        <div class="card-body">
          <div class="impact">
            ${item.impact.map((u) => `
              <div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 8 4.5-8 4.5-8-4.5z"/><path d="m4 12 8 4.5 8-4.5"/><path d="m4 16.5 8 4.5 8-4.5"/></svg>
                <span>${u}</span>
                <span class="badge badge-outline" style="margin-left:auto">待刷新</span>
              </div>`).join('')}
          </div>
        </div>
      </section>

      <div class="action-bar">
        <button class="btn btn-outlined" type="button" data-act="reject">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          拒绝
        </button>
        <button class="btn btn-filled" type="button" data-act="approve">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5L20 7"/></svg>
          通过并生效
        </button>
        <span class="spacer"></span>
        <span class="hint">
          <kbd>J</kbd> <kbd>K</kbd> 切换 · <kbd>⌘</kbd> <kbd>↵</kbd> 通过 · <kbd>⌫</kbd> 拒绝
        </span>
      </div>

    </div>
  </div>`;
}

function selectItem(id) {
  selected = id;
  renderList();
  renderDetail();
  document.querySelector('#reviewPane .pane-scroll')?.scrollTo({ top: 0 });
}

document.getElementById('list').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-id]');
  if (btn) selectItem(btn.dataset.id);
});

document.getElementById('typeFilter').addEventListener('click', (e) => {
  const chip = e.target.closest('[data-filter]');
  if (!chip) return;
  filterType = chip.dataset.filter;
  document.querySelectorAll('[data-filter]').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
  const next = visibleItems()[0];
  if (next) selected = next.id;
  renderList();
  renderDetail();
});

document.getElementById('reviewPane').addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]');
  if (!act) {
    const copyEl = e.target.closest('[data-copy]');
    if (copyEl) M3.copy(copyEl.dataset.copy);
    return;
  }
  const item = ITEMS.find((i) => i.id === selected);
  if (!item) return;
  const approve = act.dataset.act === 'approve';
  reviewed.set(item.id, approve ? 'active' : 'rejected');
  M3.snack(approve ? `已通过 · ${item.title} 转为 active` : `已拒绝 · ${item.title} 已删除并记录原因`, '撤销');

  const next = visibleItems()[0];
  if (next) {
    selected = next.id;
    renderList();
    renderDetail();
  } else {
    renderList();
    renderDetail();
    document.getElementById('reviewPane').querySelector('.pane-scroll')?.scrollTo({ top: 0 });
  }
});

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  const items = visibleItems();
  if (!items.length) return;
  const idx = items.findIndex((i) => i.id === selected);
  if (e.key === 'j' || e.key === 'ArrowDown') {
    e.preventDefault();
    selectItem(items[Math.min(items.length - 1, idx + 1)].id);
  } else if (e.key === 'k' || e.key === 'ArrowUp') {
    e.preventDefault();
    selectItem(items[Math.max(0, idx - 1)].id);
  }
});

renderList();
renderDetail();
M3.bindCopy();
</script>
</body>
</html>
