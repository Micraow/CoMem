<style>
  .main { height: calc(100vh - 64px); overflow: hidden; }
  .split { height: 100%; }

  .tree-toolbar { padding: 10px 12px; border-bottom: 1px solid var(--outline-variant); }
  .tree-legend { gap: 10px; row-gap: 6px; font-size: 13px; }

  /* ---------- 详情 ---------- */
  .detail-scroll { padding: 24px 28px 72px; }

  .detail-head { display: grid; gap: 14px; }

  .detail-title-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }

  .detail-title-row h1 {
    font-size: 28px;
    line-height: 1.29;
    font-weight: 400;
    letter-spacing: -0.005em;
    overflow-wrap: anywhere;
  }

  .detail-badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 6px; }

  .layer-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: space-between;
    padding-top: 4px;
  }

  /* 层级预算 */
  .budget {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 260px;
    flex: 1;
  }

  .budget .b-track { flex: 1; }

  .budget .b-val {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--on-surface-variant);
    white-space: nowrap;
  }

  /* 层级内容 */
  .layer-card { margin-top: 20px; }

  .layer-body {
    padding: 24px 26px 26px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--on-surface);
  }

  .layer-body h4 {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.009em;
    margin: 26px 0 10px;
    color: var(--on-surface);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .layer-body h4:first-child { margin-top: 0; }

  .layer-body h4::before {
    content: "";
    width: 4px;
    height: 16px;
    border-radius: 2px;
    background: var(--primary);
    flex: none;
  }

  .layer-body p { margin-bottom: 12px; max-width: 72ch; }
  .layer-body p:last-child { margin-bottom: 0; }

  .layer-body ul { display: grid; gap: 10px; margin-bottom: 8px; }

  .layer-body li {
    position: relative;
    padding-left: 22px;
    max-width: 74ch;
  }

  .layer-body li::before {
    content: "";
    position: absolute;
    left: 6px;
    top: 0.72em;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--outline);
  }

  .layer-body strong { font-weight: 500; color: var(--on-surface); }

  .layer-body code {
    font-size: 14px;
    padding: 2px 6px;
    border-radius: var(--radius-xs);
    background: var(--surface-container-high);
    color: var(--on-surface);
  }

  .abstract-quote {
    position: relative;
    padding: 4px 0 4px 22px;
    border-left: 2px solid var(--primary);
    font-size: 17px;
    line-height: 1.7;
    color: var(--on-surface);
    max-width: 70ch;
  }

  .abstract-note {
    margin-top: 22px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    background: var(--surface-container);
    font-size: 14px;
    line-height: 1.6;
    color: var(--on-surface-variant);
  }

  .abstract-note svg { color: var(--primary); margin-top: 1px; }

  .frontmatter {
    font-family: var(--font-mono);
    font-size: 13.5px;
    line-height: 1.85;
    padding: 16px 18px;
    border-radius: var(--radius-sm);
    background: var(--surface-container-lowest);
    border: 1px solid var(--outline-variant);
    color: var(--on-surface-variant);
    overflow-x: auto;
    margin-bottom: 22px;
    white-space: pre;
  }

  .frontmatter b { color: var(--on-surface); font-weight: 500; }

  .file-listing {
    font-family: var(--font-mono);
    font-size: 13.5px;
    line-height: 1.9;
    padding: 16px 18px;
    border-radius: var(--radius-sm);
    background: var(--surface-container-lowest);
    border: 1px solid var(--outline-variant);
    color: var(--on-surface-variant);
    overflow-x: auto;
    white-space: pre;
    margin-bottom: 20px;
  }

  .file-listing .meta { color: var(--outline); }

  /* 右侧信息列 */
  .info-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 16px;
    margin-top: 20px;
  }

  @media (min-width: 1180px) {
    .info-grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
  }

  .fresh-state {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 500;
  }

  .fresh-state.is-stale { color: var(--tertiary); }
  .fresh-state.is-fresh { color: var(--primary); }

  .fresh-gauge {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 14px;
    margin-top: 16px;
  }

  .fresh-gauge .g-v {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--on-surface-variant);
    font-variant-numeric: tabular-nums;
  }

  .task-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    background: var(--surface-container);
    font-family: var(--font-mono);
    font-size: 13.5px;
    color: var(--on-surface-variant);
    flex-wrap: wrap;
  }

  .task-pill b { color: var(--on-surface); font-weight: 500; }

  .acl-list { display: grid; gap: 2px; }

  .acl-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 12px 16px;
    background: var(--surface-container-low);
  }

  .acl-row:first-child { border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
  .acl-row:last-child { border-radius: 0 0 var(--radius-sm) var(--radius-sm); }

  .acl-p {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--on-surface);
  }

  .acl-src {
    font-size: 13px;
    color: var(--on-surface-variant);
    margin-top: 3px;
    overflow-wrap: anywhere;
  }

  .lv {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 10px;
    border-radius: var(--radius-xs);
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .lv-manage { background: var(--primary-container); color: var(--on-primary-container); }
  .lv-write { background: var(--tertiary-container); color: var(--on-tertiary-container); }
  .lv-read { background: var(--secondary-container); color: var(--on-secondary-container); }

  .meta-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1px;
    background: var(--outline-variant);
    border: 1px solid var(--outline-variant);
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-top: 20px;
  }

  .meta-strip > div { background: var(--surface-container-low); padding: 14px 16px; }

  .meta-strip .k {
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--on-surface-variant);
  }

  .meta-strip .v {
    margin-top: 4px;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--on-surface);
    overflow-wrap: anywhere;
  }

  .empty-state {
    display: grid;
    place-items: center;
    height: 100%;
    padding: 48px 32px;
    text-align: center;
    color: var(--on-surface-variant);
  }

  .empty-state .es-ico {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--surface-container-high);
    margin-bottom: 20px;
    color: var(--on-surface-variant);
  }

  @media (max-width: 900px) {
    .main { height: auto; overflow: visible; }
    .split { height: auto; }
    .pane-scroll { overflow: visible; }
  }
</style>

      <div class="es-ico"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h7.5L18 7.5V21H6z"/><path d="M13.5 3v4.5H18"/></svg></div>
      <h2 class="t-title-l" style="margin-bottom:8px;color:var(--on-surface)">没有编入视觉稿的节点</h2>
      <p class="muted-sm" style="max-width:40ch;margin:0 auto">演示数据保留了 8 个有代表性的节点，覆盖文档、目录、元数据文件与 restricted 边界。</p>
    </div></div>`;
    return;
  }

  const seg = LAYER_META.map((l, i) => `
    <button type="button" data-layer="${i}" aria-pressed="${i === currentLayer}">
      <span class="seg-k">${l.key}</span>${l.name}
    </button>`).join('');

  const layer = LAYER_META[currentLayer];
  let body = '';

  if (currentLayer === 0) {
    body = `<div class="abstract-quote">${d.l0}</div>
      <div class="abstract-note">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><path d="M12 8v.01"/></svg>
        <span>L0 从 L1 正文的 H1 之后、第一个二级标题之前的段落提取，两层不会互相矛盾。写入 <code>${layer.file}</code>，上限 ${layer.budget} 字符。</span>
      </div>`;
  } else if (currentLayer === 1) {
    body = d.l1;
  } else {
    body = d.l2;
  }

  const used = currentLayer === 0 ? d.l0meta.chars : currentLayer === 1 ? d.l1meta.chars : null;
  const budget = currentLayer === 0 ? 256 : currentLayer === 1 ? 4000 : null;
  const pct = budget ? Math.min(100, Math.round((used / budget) * 100)) : 0;

  const f = d.fresh;
  const stale = f.state === 'stale';

  pane.innerHTML = `
  <div class="pane-scroll">
    <div class="detail-scroll">

      <div class="crumb">
        <a href="index.html">控制台</a><span class="sep">/</span>
        <a href="filesystem.html">文件树</a><span class="sep">/</span>
        <span class="here mono" style="font-size:13.5px">${currentUri.replace('comem://', '')}</span>
      </div>

      <div class="detail-head">
        <div class="detail-title-row">
          <div style="min-width:0;flex:1">
            <h1>${d.name}</h1>
            <div class="uri mt-8" data-copy="${currentUri}">${currentUri}</div>
          </div>
          <div class="detail-badges">
            <span class="badge badge-primary">${d.memoryType || d.contextType}</span>
            <span class="badge ${d.status === 'pending' ? 'badge-tertiary' : 'badge-outline'} badge-dot">${d.status}</span>
          </div>
        </div>

        <div class="layer-bar">
          <div class="segmented" role="group" aria-label="摘要层级" id="layerSeg">${seg}</div>
          <div class="budget">
            <span class="b-val">${budget ? used + ' / ' + budget + ' 字 · ' + pct + '%' : '不设上限'}</span>
            <span class="meter b-track meter-thin" style="max-width:220px"><i style="width:${budget ? pct : 100}%"></i></span>
          </div>
        </div>
      </div>

      <div class="meta-strip">
        <div><div class="k">context_type</div><div class="v">${d.contextType}</div></div>
        <div><div class="k">${d.kind === 'directory' ? '子项' : '体积'}</div><div class="v">${d.kind === 'directory' ? d.size : d.size + ' · ' + d.lines + ' 行'}</div></div>
        <div><div class="k">更新于</div><div class="v">${d.updated}</div></div>
        <div><div class="k">写入次数</div><div class="v">${d.writes ?? '—'}</div></div>
        <div><div class="k">层级来源</div><div class="v">${layer.key} · ${layer.file}</div></div>
      </div>

      <section class="card card-elevated layer-card" aria-label="${layer.name}">
        <div class="card-head">
          <span class="badge badge-secondary">${layer.key}</span>
          <span class="card-title">${layer.name}</span>
          <span class="spacer"></span>
          <span class="mono-sm" style="font-size:13px">${layer.file}</span>
        </div>
        <div class="layer-body">${body}</div>
        <div class="card-foot" style="display:grid;gap:6px;color:var(--on-surface-variant);font-size:14px">
          <span>${layer.hint}</span>
          <span class="row row-wrap" style="gap:10px;font-size:13px">
            <span class="badge badge-outline" style="height:24px">摘要来源</span>
            <span class="mono" style="font-size:13px">${currentLayer === 2 ? '原始文件' : d.l0meta.by + ' · ' + d.l0meta.model}</span>
            <span style="color:var(--outline)">·</span>
            <span>生成于 ${currentLayer === 2 ? d.updated : (currentLayer === 0 ? d.l0meta.at : d.fresh.generated)}</span>
          </span>
        </div>
      </section>

      <div class="info-grid">
        <!-- 摘要新鲜度 -->
        <section class="card" aria-label="摘要新鲜度">
          <div class="card-head">
            <span class="card-title">摘要新鲜度</span>
            <span class="spacer"></span>
            <span class="badge ${stale ? 'badge-tertiary' : 'badge-secondary'}">${stale ? '待刷新' : '为最新'}</span>
          </div>
          <div class="card-body">
            <div class="fresh-state ${stale ? 'is-stale' : 'is-fresh'}">
              ${stale
                ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5l3 1.8"/></svg>'
                : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m8 12.5 2.6 2.6L16 9.5"/></svg>'}
              ${stale ? '摘要落后于内容' : '摘要与内容一致'}
            </div>
            <p class="muted-sm mt-12">${f.note}</p>
            <div class="fresh-gauge">
              <span class="g-v">${f.pending} / ${f.total}</span>
              <span class="meter"><i class="${stale ? 'is-warn' : ''}" style="width:${f.ratio}%"></i></span>
              <span class="g-v">${f.ratio}%</span>
            </div>
            <div class="row" style="justify-content:space-between;font-size:13px;color:var(--on-surface-variant);margin-top:8px">
              <span>待刷新占比</span>
              <span>触发阈值 ${f.threshold}% · 生成于 ${f.generated}</span>
            </div>
            ${f.task ? `<div class="task-pill">
              ${M3.icon('bolt', 16)}
              <span><b>${f.task.id}</b> · ${f.task.type} · ${f.task.status} · 已重试 ${f.task.retried} 次</span>
            </div>` : ''}
          </div>
        </section>

        <!-- 权限 -->
        <section class="card" aria-label="本节点权限">
          <div class="card-head">
            <span class="card-title">本节点权限</span>
            <span class="spacer"></span>
            <a class="btn btn-text btn-sm" href="acl.html">推导链</a>
          </div>
          <div class="card-body" style="padding:16px">
            <div class="acl-list">
              ${d.acl.map((a) => `
                <div class="acl-row">
                  <div>
                    <div class="acl-p">${a.p}</div>
                    <div class="acl-src">${a.src}</div>
                  </div>
                  <span class="lv ${lvClass(a.lv)}">${a.lv} · ${a.lv === 'manage' ? 7 : a.lv === 'write' ? 3 : 1}</span>
                </div>`).join('')}
            </div>
            <p class="muted-sm mt-12" style="font-size:13px">无权限的节点在列表中完全不出现，不返回占位。</p>
          </div>
        </section>
      </div>

    </div>
  </div>`;
}

renderDetail();

/* ---------- 交互 ---------- */
document.getElementById('detail').addEventListener('click', (e) => {
  const seg = e.target.closest('[data-layer]');
  if (seg) {
    currentLayer = Number(seg.dataset.layer);
    renderDetail();
    document.getElementById('detail').querySelector('.detail-title-row')?.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }
  const copyEl = e.target.closest('[data-copy]');
  if (copyEl) M3.copy(copyEl.dataset.copy);
});

document.getElementById('tree').addEventListener('click', (e) => {
  const row = e.target.closest('[data-uri]');
  if (!row || row.getAttribute('aria-disabled') === 'true') return;
  const uri = row.dataset.uri;
  if (!DOCS[uri]) {
    M3.snack('该节点没有编入视觉稿');
    return;
  }
  currentUri = uri;
  currentLayer = 0;
  document.querySelectorAll('.trow[aria-selected="true"]').forEach((n) => n.removeAttribute('aria-selected'));
  row.setAttribute('aria-selected', 'true');
  renderDetail();
  document.querySelector('.pane-scroll')?.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('treeFilter').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.tree .trow').forEach((row) => {
    const hit = !q || row.dataset.name.includes(q);
    row.style.display = hit ? '' : 'none';
    if (hit && q) {
      let p = row.parentElement;
      while (p && p !== document.getElementById('tree')) {
        if (p.tagName === 'DETAILS') p.open = true;
        p = p.parentElement;
      }
    }
  });
});

document.querySelectorAll('[data-snack]').forEach((btn) => {
  btn.addEventListener('click', () => M3.snack(btn.dataset.snack));
});

M3.bindCopy();
</script>
</body>
</html>
