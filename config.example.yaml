# 数据根。留空表示按运行形态推导（见 6.5），容器里由镜像钉死为 /var/lib/comem
dataDir: ""

providers:
  llm:
    default:
      type: openai-compatible      # openai-compatible | anthropic
      baseUrl: https://api.example.com/v1
      model: gpt-4o-mini
      apiKey: ${COMEM_LLM_KEY}
      maxTokens: 32768
      timeoutSeconds: 120
      pricing:                  # 用于成本换算，按 1M token 计
        inputPerMillion: 0.15
        outputPerMillion: 0.60

  # 语义检索的向量来源（OpenAI 兼容的 /v1/embeddings）。
  #
  # type: disabled 是默认值——没配就不产生嵌入调用。线上写记忆是热路径，
  # 一次悄悄打出去的网络请求会把「本地数据库」变成「依赖第三方可用性的数据库」。
  #
  # 把 retrieval.engine 设为 vector / hybrid 而这里仍是 disabled 时，
  # loadConfig 会抛 INVALID_ARGUMENT。不要静默降级：那正是「配置改了不生效」。
  embedding:
    type: openai-compatible    # openai-compatible | disabled
    baseUrl: https://api.example.com/v1
    model: BAAI/bge-m3
    apiKey: ${COMEM_EMBEDDING_KEY}
    # 必须与模型一致。写错在第一次嵌入时抛 PROVIDER_UNAVAILABLE——
    # 维度不匹配时向量检索会把所有行当噪音跳过，且不报错。
    dimension: 1024
    maxBatchSize: 64           # 供应商常见上限 100–2048，取保守值
    timeoutSeconds: 30

  # 重排（Cohere / Jina 兼容的 POST /rerank）。
  #
  # 重排模型看 (query, 摘要) 对，分数直接决定排序；relevance_score 未归一化，
  # 可以是负数，不要 clamp 到 [0, 1]。打开 retrieval.rerank.enabled 时这里必须
  # 配成 http，否则 loadConfig 抛 INVALID_ARGUMENT。
  rerank:
    type: disabled             # http | disabled
    baseUrl: ""                # 如 https://api.jina.ai/v1
    model: BAAI/bge-reranker-v2-m3
    apiKey: ""
    timeoutSeconds: 10
    topN: 50                   # 送去重排的候选条数上限

summary:
  generator: llm          # llm | rule
  abstractMaxChars: 256
  overviewMaxChars: 4000

retrieval:
  # fts5 | vector | hybrid
  #   fts5   关键词检索（BM25 + 中文 unigram 分词），零依赖
  #   vector 语义检索，需要 providers.embedding
  #   hybrid 并行跑两者再按 RRF 融合（推荐：关键词擅长专有名词，语义擅长同义改写）
  engine: fts5
  candidateMultiplier: 4  # 先取 limit×N 候选，再按权限过滤
  levelWeights:           # 层级加权，用于 BM25 平局时打破
    l0: 1.15
    l1: 1.05
    l2: 1.00
  queryFilters: []        # sed 风格正则，作用在 prompt 上，产物才是查询
  assembly:
    maxTokens: 1600       # 注入模型的 token 预算
    dedupTurns: 3         # 这么多轮内投过的 URI 不再投
    quotaPreset: coding   # chat | coding
  # 重排：默认关。打开后融合结果先过重排模型，再按 keepTopN 截断。
  rerank:
    enabled: false
    keepTopN: 0           # 重排后保留前 N 条；0 = 只重排不截断

session:
  autoCommit:
    enabled: true
    pendingTokenThreshold: 150000
    messageCountThreshold: 100
    minCommitIntervalSeconds: 0
    idleTimeoutSeconds: 0     # 0 = 关；开了需要服务端扫描器
    keepRecentCount: 0
  # 会话过期（与 autoCommit.idleTimeoutSeconds 是两件事：那个是「空闲多久该提交」，
  # 这个是「空闲多久该归档 / 删除」）。默认全关：删数据必须是显式选择。
  expiry:
    idleTimeoutSeconds: 0     # 空闲多久后归档。0 = 关
    action: archive           # archive | delete。默认归档——删除是不可逆的

memory:
  reviewRequired:
    - experiences
    - rules
  workingMemory:
    enabled: false        # 开它会多一次 LLM 调用
  # 记忆的 TTL。清扫只做软过期（status = archived），物理删除由运维显式做。
  ttl:
    defaultDays: 0         # 记忆默认存活天数。0 = 永不过期（默认）
    sweepBatchSize: 100    # 每轮最多清扫多少条，防止一次清太多把库锁住
  # 记忆合并（agentic 循环：模型先读正文再给 add / update / delete）。
  #
  # 默认关：合并会 delete，是破坏性操作，必须显式开启。关着的时候端点明确拒绝。
  # 开启时 summary.generator 必须是 llm，否则 loadConfig 抛 INVALID_ARGUMENT。
  consolidation:
    enabled: false
    maxIterations: 10      # 探索轮次上限；到上限还没给出操作就整次失败（不做部分应用）

acl:
  groupDefaultLevel: write   # write | read

server:
  host: 127.0.0.1
  port: 1933
  # 服务图绑定的主体（user:{id} 或 group:{id}，id 为小写字母或数字开头、最长 64 个字符）。
  # 这是单用户部署的绑定身份：HTTP 的 x-comem-subject 与它不一致时 401。
  # user:local 只是为了让 pnpm dev 开箱即用；生产部署应显式配置成实际的用户。
  subject: user:local

auth:
  # 多用户认证（架构文档 §12.7）。默认 false = v1 单用户行为：
  # x-comem-subject 必须等于 server.subject。
  #
  # 打开后 x-comem-subject 被忽略，必须带
  #   Authorization: Bearer <session token>        （POST /api/v1/auth/login 换得）
  #   Authorization: Bearer comem_<prefix>_<secret>（POST /api/v1/admin/users/{id}/api-keys 创建）
  # 缺失或非法一律 401 UNAUTHENTICATED。组主体仍然不能当认证身份。
  enabled: false
  # session token 的 HMAC 密钥。留空时进程启动生成随机值——重启即失效。
  # 多实例部署必须显式配置同一个值，否则一个实例签发的 token 在另一个实例上无效。
  sessionSecret: ""
  # session token 有效期（秒）。默认 86400 = 一天。
  sessionTtlSeconds: 86400

logging:
  level: info
  file: ""                   # 留空只写 stdout；填路径则额外写 error.log

telemetry:
  metrics:
    enabled: true
    includeAccountLabel: false   # 单账号部署没必要，开了会放大基数
  requestLog:
    enabled: true
    retainDays: 7
    retainRows: 100000
    sampleRate: 1.0          # 1.0 = 全量；错误请求永远全量记录
  hookOverhead:
    enabled: true            # Hook 上报阻塞开销，控制台「监控」页用
  hotness:
    halfLifeHours: 168       # 一周
    weight: 0                # 热度对最终排序的影响：0 = 只做冷热标记；1 = 与检索分同权

task:
  leaseSeconds: 60
  maxAttempts: 3
  concurrency: 4

# 本机 Agent 对话导入（架构文档 §11.9）。
#
# 默认关闭：导入会往数据根写大量会话与消息，必须是显式选择。关着时
# `pnpm ingest` 拒绝真正写入，只允许 `--dry-run` 报告。
ingest:
  enabled: false
  # 每个会话一次读多少条。100 与 MCP 单次批量写入的量级一致（§10.6 的验收场景
  # 就是 100 个文件）。调大减少游标写入次数，代价是单批内存占用。
  batchSize: 100
  # 阶段二（记忆抽取）每批等多少个会话。20 的来源：一批 20 个会话 × 每会话
  # 1–2 次模型调用 ≈ 20–40 次调用，按 5 秒/次约 100–200 秒；用户在终端里按
  # 「批」看到进度，而不是等 908 个会话全部导完才出第一行。
  extractionBatchSize: 20
  # 每批阶段二的最长等待，毫秒。30 分钟是「908 个会话 × 1–2 次调用 × 5 秒/次
  # ≈ 2–3 小时」换算到一批 20 个会话（约 3–7 分钟）后的 4–10 倍余量。
  # 超时按批算，不是按总量；0 = 不等（等价于 --no-wait）。
  extractionTimeoutMs: 1800000
  # 源路径覆盖。留空用各宿主的默认路径：
  #   claude-code  ~/.claude/projects（目录，递归）
  #   codex        ~/.codex/sessions（目录，递归找 rollout-*.jsonl）
  #   deepseek     ~/Downloads/**/conversations.json（文件）
  #   qwen         ~/Downloads/**/Qwen-chat-export-*.json（文件）
  paths:
    claude-code: []
    codex: []
    deepseek: []
    qwen: []
