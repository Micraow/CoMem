# 数据根。留空表示按运行形态推导（见 6.5），容器里由镜像钉死为 /var/lib/comem
dataDir: ""

providers:
  llm:
    default:
      type: openai-compatible      # openai-compatible | anthropic
      baseUrl: https://api.example.com/v1
      model: gpt-4o-mini
      apiKey: ${COMEM_LLM_KEY}
      maxTokens: 32768
      timeoutSeconds: 120
      pricing:                  # 用于成本换算，按 1M token 计
        inputPerMillion: 0.15
        outputPerMillion: 0.60

  # 语义检索的向量来源（OpenAI 兼容的 /v1/embeddings）。
  #
  # type: disabled 是默认值——没配就不产生嵌入调用。线上写记忆是热路径，
  # 一次悄悄打出去的网络请求会把「本地数据库」变成「依赖第三方可用性的数据库」。
  #
  # 把 retrieval.engine 设为 vector / hybrid 而这里仍是 disabled 时，
  # loadConfig 会抛 INVALID_ARGUMENT。不要静默降级：那正是「配置改了不生效」。
  embedding:
    type: openai-compatible    # openai-compatible | disabled
    baseUrl: https://api.example.com/v1
    model: BAAI/bge-m3
    apiKey: ${COMEM_EMBEDDING_KEY}
    # 必须与模型一致。写错在第一次嵌入时抛 PROVIDER_UNAVAILABLE——
    # 维度不匹配时向量检索会把所有行当噪音跳过，且不报错。
    dimension: 1024
    maxBatchSize: 64           # 供应商常见上限 100–2048，取保守值
    timeoutSeconds: 30

  # 重排（Cohere / Jina 兼容的 POST /rerank）。
  #
  # 重排模型看 (query, 摘要) 对，分数直接决定排序；relevance_score 未归一化，
  # 可以是负数，不要 clamp 到 [0, 1]。打开 retrieval.rerank.enabled 时这里必须
  # 配成 http，否则 loadConfig 抛 INVALID_ARGUMENT。
  rerank:
    type: disabled             # http | disabled
    baseUrl: ""                # 如 https://api.jina.ai/v1
    model: BAAI/bge-reranker-v2-m3
    apiKey: ""
    timeoutSeconds: 10
    topN: 50                   # 送去重排的候选条数上限

summary:
  generator: llm          # llm | rule
  abstractMaxChars: 256
  overviewMaxChars: 4000

retrieval:
  # fts5 | vector | hybrid
  #   fts5   关键词检索（BM25 + 中文 unigram 分词），零依赖
  #   vector 语义检索，需要 providers.embedding
  #   hybrid 并行跑两者再按 RRF 融合（推荐：关键词擅长专有名词，语义擅长同义改写）
  engine: fts5
  candidateMultiplier: 4  # 先取 limit×N 候选，再按权限过滤
  levelWeights:           # 层级加权，用于 BM25 平局时打破
    l0: 1.15
    l1: 1.05
    l2: 1.00
  queryFilters: []        # sed 风格正则，作用在 prompt 上，产物才是查询
  assembly:
    maxTokens: 1600       # 注入模型的 token 预算
    dedupTurns: 3         # 这么多轮内投过的 URI 不再投
    quotaPreset: coding   # chat | coding
  # 重排：默认关。打开后融合结果先过重排模型，再按 keepTopN 截断。
  rerank:
    enabled: false
    keepTopN: 0           # 重排后保留前 N 条；0 = 只重排不截断

session:
  autoCommit:
    enabled: true
    pendingTokenThreshold: 150000
    messageCountThreshold: 100
    minCommitIntervalSeconds: 0
    idleTimeoutSeconds: 0     # 0 = 关；开了需要服务端扫描器
    keepRecentCount: 0
  # 会话过期（与 autoCommit.idleTimeoutSeconds 是两件事：那个是「空闲多久该提交」，
  # 这个是「空闲多久该归档 / 删除」）。默认全关：删数据必须是显式选择。
  expiry:
    idleTimeoutSeconds: 0     # 空闲多久后归档。0 = 关
    action: archive           # archive | delete。默认归档——删除是不可逆的

memory:
  reviewRequired:
    - experiences
    - rules
  workingMemory:
    enabled: false        # 开它会多一次 LLM 调用
  # 记忆的 TTL。清扫只做软过期（status = archived），物理删除由运维显式做。
  ttl:
    defaultDays: 0         # 记忆默认存活天数。0 = 永不过期（默认）
    sweepBatchSize: 100    # 每轮最多清扫多少条，防止一次清太多把库锁住

acl:
  groupDefaultLevel: write   # write | read

server:
  host: 127.0.0.1
  port: 1933

logging:
  level: info
  file: ""                   # 留空只写 stdout；填路径则额外写 error.log

telemetry:
  metrics:
    enabled: true
    includeAccountLabel: false   # 单账号部署没必要，开了会放大基数
  requestLog:
    enabled: true
    retainDays: 7
    retainRows: 100000
    sampleRate: 1.0          # 1.0 = 全量；错误请求永远全量记录
  hookOverhead:
    enabled: true            # Hook 上报阻塞开销，控制台「监控」页用
  hotness:
    halfLifeHours: 168       # 一周

task:
  leaseSeconds: 60
  maxAttempts: 3
  concurrency: 4
